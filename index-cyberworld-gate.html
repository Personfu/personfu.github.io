<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://personfu.github.io/cyberworld.html">
  <title>CyberWorld Gateway</title>
  <style>
    :root { color-scheme: dark; --cyan:#6feaff; --pink:#ff7df0; --bg:#101827; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(111,234,255,.18), transparent 30%),
        radial-gradient(circle at 75% 70%, rgba(255,125,240,.16), transparent 30%),
        linear-gradient(135deg, #162033, var(--bg));
      font-family: "Segoe UI", Arial, sans-serif;
      color: #eefbff;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      padding: 34px;
      border: 1px solid rgba(111,234,255,.35);
      border-radius: 24px;
      background: rgba(11,18,31,.78);
      box-shadow: 0 24px 80px rgba(0,0,0,.35), inset 0 0 24px rgba(111,234,255,.06);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 8vw, 76px);
      letter-spacing: .08em;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(111,234,255,.42);
    }
    p { margin: 0 auto 24px; max-width: 54ch; line-height: 1.6; color: #c7d9e6; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid var(--cyan);
      border-radius: 16px;
      color: #07131d;
      background: var(--cyan);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 24px rgba(111,234,255,.28);
    }
  </style>
</head>
<body>
  <main>
    <h1>CYBERWORLD</h1>
    <p>Personfu is being consolidated into CyberWorld. WarGames, CTF Trail, Signal Lab, Forensics, RedOps, Intel, Arcade, and AI Ops are now destinations inside the MMO hub.</p>
    <a href="https://personfu.github.io/cyberworld.html">Enter CyberWorld</a>
  </main>
</body>
</html>
