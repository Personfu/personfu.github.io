<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#00e8ff;font-family:'Share Tech Mono',monospace;min-height:100vh}
a{color:#00e8ff;text-decoration:none}a:hover{color:#ff2bd6}
#top-bar{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00e8ff33}
#top-bar h1{font-family:'VT323',monospace;font-size:32px;letter-spacing:3px}
.tabs{display:flex;gap:4px;padding:10px 20px;flex-wrap:wrap}
.tab{padding:10px 20px;background:rgba(0,232,255,0.05);border:1px solid #00e8ff33;cursor:pointer;font-family:'VT323',monospace;font-size:18px;color:#00e8ff;border-radius:3px 3px 0 0;transition:.2s}
.tab:hover,.tab.active{background:rgba(0,232,255,0.15);border-color:#00e8ff}
.game-area{padding:20px;display:flex;flex-direction:column;align-items:center}
.game-panel{display:none}
.game-panel.active{display:block}
canvas{border:1px solid #00e8ff33;background:#050a12;display:block;margin:10px auto}
.info{font-family:'VT323',monospace;font-size:20px;text-align:center;margin:10px;color:#ffb347}
.btn{background:transparent;border:1px solid #00e8ff44;color:#00e8ff;padding:10px 24px;font-family:'Share Tech Mono',monospace;cursor:pointer;border-radius:3px;font-size:14px;margin:5px}
.btn:hover{background:#00e8ff22}
.hi{font-size:13px;color:#00ff9c;text-align:center;margin:8px}
/* Hash Matcher */
.card-grid{display:grid;grid-template-columns:repeat(4,80px);gap:8px;justify-content:center;margin:16px auto}
.card{width:80px;height:80px;background:#0a1020;border:1px solid #00e8ff44;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;text-align:center;padding:4px;border-radius:3px;transition:.2s;color:transparent;user-select:none}
.card.flipped,.card.matched{color:#00ff9c;background:#0a1828;border-color:#00ff9c66}
.card.matched{color:#ff2bd6;border-color:#ff2bd6}
/* Port Scanner */
.port-grid{display:grid;grid-template-columns:repeat(5,70px);gap:6px;justify-content:center;margin:16px auto}
.port{width:70px;height:50px;background:#0a1020;border:1px solid #333;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'VT323',monospace;font-size:16px;color:#666;border-radius:3px;transition:.2s}
.port.open{border-color:#00ff9c;color:#00ff9c;box-shadow:0 0 8px #00ff9c33}
.port.scanned{border-color:#ff2bd6;color:#ff2bd6}
.port.miss{border-color:#ff000066;color:#ff000066}
/* Cipher Sprint */
#cipher-area{max-width:600px;margin:0 auto;text-align:center}
#cipher-encoded{font-family:'VT323',monospace;font-size:28px;color:#ff2bd6;margin:16px 0;word-break:break-all}
#cipher-input{background:#0a1020;border:1px solid #00e8ff44;color:#00e8ff;padding:12px;font-family:'Share Tech Mono',monospace;font-size:16px;width:100%;border-radius:3px;text-align:center}
</style>
</head>
<body>
<div id="top-bar">
<h1>CYBER ARCADE</h1>
<a href="/CyberWorld/">&#8592; Back to CyberWorld</a>
</div>
<div class="tabs">
<div class="tab active" onclick="switchGame(0)">FIREWALL PONG</div>
<div class="tab" onclick="switchGame(1)">HASH MATCHER</div>
<div class="tab" onclick="switchGame(2)">PORT SCANNER</div>
<div class="tab" onclick="switchGame(3)">CIPHER SPRINT</div>
</div>
<div class="game-area">

<!-- PONG -->
<div class="game-panel active" id="game0">
<div class="info" id="pong-score">FIREWALL 0 - 0 THREAT</div>
<canvas id="pong" width="600" height="400"></canvas>
<div class="hi" id="pong-hi"></div>
<button class="btn" onclick="pongStart()">START MATCH</button>
</div>

<!-- HASH MATCHER -->
<div class="game-panel" id="game1">
<div class="info" id="hash-info">Match attacks to defenses! Click to flip cards.</div>
<div class="card-grid" id="card-grid"></div>
<div class="hi" id="hash-hi"></div>
<button class="btn" onclick="hashStart()">NEW GAME</button>
</div>

<!-- PORT SCANNER -->
<div class="game-panel" id="game2">
<div class="info" id="port-info">Click open ports before they close! 30 seconds.</div>
<div class="port-grid" id="port-grid"></div>
<div class="hi" id="port-hi"></div>
<button class="btn" onclick="portStart()">START SCAN</button>
</div>

<!-- CIPHER SPRINT -->
<div class="game-panel" id="game3">
<div class="info" id="cipher-info">Decode the ROT13 cipher! Type the decoded text. 10 rounds.</div>
<div id="cipher-area">
<div id="cipher-encoded"></div>
<input id="cipher-input" placeholder="Type decoded text here..." oninput="cipherCheck()">
</div>
<div class="hi" id="cipher-hi"></div>
<button class="btn" onclick="cipherStart()">START SPRINT</button>
</div>

</div>
<script>
function switchGame(i){
document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
document.querySelectorAll('.game-panel').forEach((p,j)=>p.classList.toggle('active',j===i));
}

function getHi(k){return parseInt(localStorage.getItem('cw.arcade.'+k)||'0')}
function setHi(k,v){const old=getHi(k);if(v>old)localStorage.setItem('cw.arcade.'+k,v);return Math.max(v,old)}
function showHi(el,k,label){const h=getHi(k);el.textContent=h?'HIGH SCORE: '+h+' '+label:'';}

// ===== FIREWALL PONG =====
const pc=document.getElementById('pong'),pctx=pc.getContext('2d');
let pongRunning=false,pongAF;
let pPadY=170,ePadY=170,ballX=300,ballY=200,ballDX=4,ballDY=3,pScore=0,eScore=0;
const PW=10,PH=60,BR=6;
let keys={};
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()});
document.addEventListener('keyup',e=>keys[e.key]=false);

function pongStart(){
pScore=0;eScore=0;ballX=300;ballY=200;ballDX=4;ballDY=3;pPadY=170;ePadY=170;
pongRunning=true;if(pongAF)cancelAnimationFrame(pongAF);pongLoop();
}
function pongLoop(){
if(!pongRunning)return;
if(keys.ArrowUp)pPadY=Math.max(0,pPadY-5);
if(keys.ArrowDown)pPadY=Math.min(340,pPadY+5);
const ec=ePadY+PH/2;if(ec<ballY-10)ePadY+=3.5;else if(ec>ballY+10)ePadY-=3.5;
ePadY=Math.max(0,Math.min(340,ePadY));
ballX+=ballDX;ballY+=ballDY;
if(ballY<=BR||ballY>=400-BR)ballDY*=-1;
if(ballX<=20+PW&&ballY>=pPadY&&ballY<=pPadY+PH){ballDX=Math.abs(ballDX);ballDY+=(Math.random()-0.5)*2}
if(ballX>=580-PW&&ballY>=ePadY&&ballY<=ePadY+PH){ballDX=-Math.abs(ballDX);ballDY+=(Math.random()-0.5)*2}
if(ballX<0){eScore++;resetBall()}
if(ballX>600){pScore++;resetBall()}
document.getElementById('pong-score').textContent='FIREWALL '+pScore+' - '+eScore+' THREAT';
if(pScore>=5||eScore>=5){
pongRunning=false;
const hi=setHi('pong',pScore);
showHi(document.getElementById('pong-hi'),'pong','wins');
document.getElementById('pong-score').textContent+=(pScore>=5?' // FIREWALL WINS!':' // THREAT WINS!');
}
pongDraw();
pongAF=requestAnimationFrame(pongLoop);
}
function resetBall(){ballX=300;ballY=200;ballDX=(Math.random()>0.5?4:-4);ballDY=(Math.random()-0.5)*6}
function pongDraw(){
pctx.fillStyle='#050a12';pctx.fillRect(0,0,600,400);
pctx.setLineDash([4,8]);pctx.strokeStyle='#00e8ff22';pctx.beginPath();pctx.moveTo(300,0);pctx.lineTo(300,400);pctx.stroke();pctx.setLineDash([]);
pctx.fillStyle='#00e8ff';pctx.fillRect(10,pPadY,PW,PH);
pctx.fillStyle='#ff2bd6';pctx.fillRect(580,ePadY,PW,PH);
pctx.beginPath();pctx.arc(ballX,ballY,BR,0,Math.PI*2);pctx.fillStyle='#00ff9c';pctx.fill();
pctx.font='10px Share Tech Mono';pctx.fillStyle='#00e8ff88';pctx.textAlign='center';
pctx.fillText('FIREWALL',16,pPadY-5);pctx.fillText('THREAT',584,ePadY-5);
pctx.fillText('PACKET',ballX,ballY-10);
}
pongDraw();showHi(document.getElementById('pong-hi'),'pong','wins');

// ===== HASH MATCHER =====
const pairs=[
['SQLi','Parameterized Queries'],['XSS','Output Encoding'],['CSRF','Anti-CSRF Tokens'],['Buffer Overflow','Bounds Checking'],
['Brute Force','Rate Limiting'],['Man-in-Middle','TLS Encryption'],['Privilege Esc','Least Privilege'],['DNS Spoofing','DNSSEC']
];
let hashCards=[],hashFlipped=[],hashMatched=0,hashLocked=false,hashTimer=0,hashInterval;

function hashStart(){
hashMatched=0;hashLocked=false;hashTimer=0;
clearInterval(hashInterval);
hashInterval=setInterval(()=>{hashTimer++;document.getElementById('hash-info').textContent='Time: '+hashTimer+'s | Pairs: '+hashMatched+'/8'},1000);
const arr=[];
pairs.forEach(([a,d],i)=>{arr.push({text:a,pair:i,type:'attack'});arr.push({text:d,pair:i,type:'defense'})});
for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
hashCards=arr;hashFlipped=[];
const grid=document.getElementById('card-grid');grid.innerHTML='';
arr.forEach((c,i)=>{
const div=document.createElement('div');div.className='card';div.textContent=c.text;
div.onclick=()=>hashFlip(i,div);grid.appendChild(div);
});
}
function hashFlip(i,el){
if(hashLocked||el.classList.contains('flipped')||el.classList.contains('matched'))return;
el.classList.add('flipped');hashFlipped.push({i,el});
if(hashFlipped.length===2){
hashLocked=true;
const[a,b]=hashFlipped;
if(hashCards[a.i].pair===hashCards[b.i].pair&&a.i!==b.i){
a.el.classList.add('matched');b.el.classList.add('matched');
hashMatched++;hashFlipped=[];hashLocked=false;
if(hashMatched===8){clearInterval(hashInterval);
const hi=setHi('hash',Math.max(1,300-hashTimer));
document.getElementById('hash-info').textContent='All matched in '+hashTimer+'s!';
showHi(document.getElementById('hash-hi'),'hash','pts');
}
}else{
setTimeout(()=>{a.el.classList.remove('flipped');b.el.classList.remove('flipped');hashFlipped=[];hashLocked=false},800);
}
}
}
showHi(document.getElementById('hash-hi'),'hash','pts');

// ===== PORT SCANNER =====
const portNums=[21,22,23,25,53,80,110,143,443,445,993,995,1433,3306,3389,5432,5900,8080,8443,9090];
let portScore=0,portTimer=0,portInterval,portOpenInterval,portRunning=false;

function portStart(){
portScore=0;portTimer=30;portRunning=true;
document.getElementById('port-info').textContent='Time: 30s | Score: 0';
const grid=document.getElementById('port-grid');grid.innerHTML='';
portNums.forEach((p,i)=>{
const div=document.createElement('div');div.className='port';div.textContent=p;div.id='port-'+i;
div.onclick=()=>portClick(i,div);grid.appendChild(div);
});
clearInterval(portInterval);clearInterval(portOpenInterval);
portInterval=setInterval(()=>{
portTimer--;document.getElementById('port-info').textContent='Time: '+portTimer+'s | Score: '+portScore;
if(portTimer<=0){portRunning=false;clearInterval(portInterval);clearInterval(portOpenInterval);
const hi=setHi('port',portScore);
document.getElementById('port-info').textContent='Time up! Score: '+portScore;
showHi(document.getElementById('port-hi'),'port','pts');
}
},1000);
portOpenInterval=setInterval(()=>{
if(!portRunning)return;
const i=Math.floor(Math.random()*20);
const el=document.getElementById('port-'+i);
if(el&&!el.classList.contains('scanned')){
el.classList.add('open');
setTimeout(()=>{if(portRunning)el.classList.remove('open')},2000);
}
},600);
}
function portClick(i,el){
if(!portRunning||el.classList.contains('scanned'))return;
if(el.classList.contains('open')){portScore+=10;el.classList.remove('open');el.classList.add('scanned');
document.getElementById('port-info').textContent='Time: '+portTimer+'s | Score: '+portScore;
}else{portScore=Math.max(0,portScore-5);el.classList.add('miss');setTimeout(()=>el.classList.remove('miss'),300)}
}
showHi(document.getElementById('port-hi'),'port','pts');

// ===== CIPHER SPRINT =====
const cipherWords=['firewall','encryption','malware','phishing','rootkit','exploit','payload','backdoor','botnet','ransomware','trojan','keylogger','honeypot','spyware','darkweb','protocol','handshake','overflow','sandbox','forensics'];
let cipherRound=0,cipherTarget='',cipherScore=0,cipherStart_t=0,cipherRunning=false;

function rot13(s){return s.replace(/[a-z]/gi,c=>{const b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+13)%26+b)})}

function cipherStart(){
cipherRound=0;cipherScore=0;cipherRunning=true;cipherNext();
}
function cipherNext(){
if(cipherRound>=10){cipherRunning=false;
const hi=setHi('cipher',cipherScore);
document.getElementById('cipher-info').textContent='Sprint complete! Score: '+cipherScore;
document.getElementById('cipher-encoded').textContent='';
document.getElementById('cipher-input').value='';
showHi(document.getElementById('cipher-hi'),'cipher','pts');
return;
}
cipherRound++;
const words=[];for(let i=0;i<2+Math.floor(Math.random()*2);i++)words.push(cipherWords[Math.floor(Math.random()*cipherWords.length)]);
cipherTarget=words.join(' ');
document.getElementById('cipher-encoded').textContent=rot13(cipherTarget);
document.getElementById('cipher-input').value='';
document.getElementById('cipher-input').focus();
document.getElementById('cipher-info').textContent='Round '+cipherRound+'/10 | Score: '+cipherScore+' | Decode the ROT13!';
cipherStart_t=Date.now();
}
function cipherCheck(){
if(!cipherRunning)return;
const v=document.getElementById('cipher-input').value.trim().toLowerCase();
if(v===cipherTarget.toLowerCase()){
const elapsed=(Date.now()-cipherStart_t)/1000;
const pts=Math.max(10,Math.round(100-elapsed*10));
cipherScore+=pts;
cipherNext();
}
}
showHi(document.getElementById('cipher-hi'),'cipher','pts');
</script>
</body>
</html>
