<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#c0c0c0;font-family:'Share Tech Mono',monospace;min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#02070d}
::-webkit-scrollbar-thumb{background:#00e8ff33;border-radius:3px}
a{color:#00e8ff;text-decoration:none}
a:hover{text-shadow:0 0 8px #00e8ff}
.back-link{position:fixed;top:16px;left:16px;z-index:100;font-family:'VT323',monospace;font-size:1.2rem;padding:6px 14px;border:1px solid #00e8ff44;background:#02070dcc;backdrop-filter:blur(6px);border-radius:4px}
h1{font-family:'VT323',monospace;font-size:2.8rem;text-align:center;padding:60px 20px 10px;color:#00e8ff;text-shadow:0 0 20px #00e8ff66}
.subtitle{text-align:center;color:#ff2bd6;font-family:'VT323',monospace;font-size:1.3rem;margin-bottom:24px}
.container{max-width:1200px;margin:0 auto;padding:0 20px 60px}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.filter-btn{padding:8px 16px;font-family:'VT323',monospace;font-size:1rem;background:transparent;border:1px solid #ffffff20;color:#c0c0c0;cursor:pointer;border-radius:4px;transition:.2s}
.filter-btn:hover,.filter-btn.active{border-color:#ff2bd6;color:#ff2bd6;background:#ff2bd611}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{border:1px solid #ffffff15;background:#ffffff06;border-radius:6px;padding:20px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00e8ff,#ff2bd6);opacity:0;transition:.3s}
.card:hover{border-color:#00e8ff44;transform:translateY(-2px);box-shadow:0 4px 20px #00e8ff11}
.card:hover::before{opacity:1}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-name{font-family:'VT323',monospace;font-size:1.5rem;color:#00e8ff}
.card-type{font-size:.7rem;padding:3px 8px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.type-nation{border:1px solid #ff2bd6;color:#ff2bd6}
.type-criminal{border:1px solid #ff6b35;color:#ff6b35}
.type-hacktivist{border:1px solid #00ff6a;color:#00ff6a}
.type-insider{border:1px solid #ffcc00;color:#ffcc00}
.type-unknown{border:1px solid #888;color:#888}
.card-meta{font-size:.8rem;color:#888;margin-bottom:8px}
.card-meta span{margin-right:14px}
.stars{color:#ff2bd6;letter-spacing:2px}
.card-targets{font-size:.8rem;color:#aaa}
.card-expand{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #ffffff15;animation:fadeIn .3s}
.card.open .card-expand{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.detail-section{margin-bottom:12px}
.detail-section h4{font-family:'VT323',monospace;font-size:1.1rem;color:#ff2bd6;margin-bottom:6px}
.detail-section p,.detail-section li{font-size:.85rem;line-height:1.6}
.detail-section ul{list-style:none;padding-left:0}
.detail-section li::before{content:'> ';color:#00e8ff}
.campaign{background:#ffffff06;border:1px solid #ffffff10;padding:10px;margin:6px 0;border-radius:4px;font-size:.85rem}
.campaign strong{color:#00e8ff}
.defense-list li::before{content:'[+] ';color:#00ff6a}
.click-hint{font-size:.75rem;color:#555;text-align:center;margin-top:4px}
@media(max-width:600px){h1{font-size:2rem;padding-top:50px}.grid{grid-template-columns:1fr}}
</style>
</head>

const typeMap={'nation-state':'type-nation','criminal':'type-criminal','hacktivist':'type-hacktivist','insider':'type-insider','unknown':'type-unknown'};
const types=['ALL','nation-state','criminal','hacktivist','insider','unknown'];
let activeFilter='ALL';

const filtersEl=document.getElementById('filters');
types.forEach(t=>{
const b=document.createElement('button');b.className='filter-btn'+(t==='ALL'?' active':'');b.textContent=t.toUpperCase();
b.onclick=()=>{activeFilter=t;filtersEl.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderGrid()};
filtersEl.appendChild(b)});

function renderGrid(){
const g=document.getElementById('grid');g.innerHTML='';
const filtered=activeFilter==='ALL'?actors:actors.filter(a=>a.type===activeFilter);
filtered.forEach(a=>{
const c=document.createElement('div');c.className='card';
const stars='&#9733;'.repeat(a.sophistication)+'&#9734;'.repeat(5-a.sophistication);
c.innerHTML=`
<div class="card-header"><span class="card-name">${a.name}</span><span class="card-type ${typeMap[a.type]}">${a.type}</span></div>

<div class="card-meta"><span>Sophistication: <span class="stars">${stars}</span></span></div>
<div class="card-targets">Targets: ${a.targets}</div>
<p class="click-hint">[ click to expand ]</p>
<div class="card-expand">
<div class="detail-section"><h4>TTPs</h4><ul>${a.ttps.map(t=>'<li>'+t+'</li>').join('')}</ul></div>
<div class="detail-section"><h4>CAMPAIGNS</h4>${a.campaigns.map(c=>'<div class="campaign"><strong>'+c.name+'</strong><br>'+c.desc+'</div>').join('')}</div>
<div class="detail-section"><h4>RECOMMENDED DEFENSES</h4><ul class="defense-list">${a.defenses.map(d=>'<li>'+d+'</li>').join('')}</ul></div>
</div>`;
c.onclick=()=>{c.classList.toggle('open');c.querySelector('.click-hint').textContent=c.classList.contains('open')?'[ click to collapse ]':'[ click to expand ]'};
g.appendChild(c)})}

renderGrid();
</script>
