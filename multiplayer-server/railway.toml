[build]
builder = "nixpacks"
buildCommand = "npm install"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# ── Environment Variables (Railway → Service → Variables) ────────
#
#   REQUIRED:
#   JWT_SECRET            — 64-char hex. Generate: openssl rand -hex 48
#
#   DATABASE & CACHE:
#   DATABASE_URL          — Railway Postgres add-on connection string
#   REDIS_URL             — Railway Redis add-on connection string
#
#   SECURITY:
#   ADMIN_KEY             — Secret key for /api/admin/* endpoints (openssl rand -hex 32)
#   APP_ORIGIN            — Comma-separated CORS origins (default *)
#                           e.g. https://personfu.github.io,https://fllc.net
#
#   INTEL:
#   NVD_API_KEY           — NIST NVD API key (https://nvd.nist.gov/developers/request-an-API-key)
#                           Without this, NVD queries are rate-limited to 5 req/30s
#
#   METASPLOIT RPC (optional — connect a live Metasploit service):
#   MSF_RPC_URL           — Internal Railway URL: http://msf-service.railway.internal:4567
#   MSF_RPC_PASS          — Metasploit RPC password
#
#   BILLING:
#   STRIPE_SECRET_KEY     — sk_live_... or sk_test_...
#   STRIPE_WEBHOOK_SECRET — whsec_...
#   STRIPE_PRICE_ID       — price_...
# ─────────────────────────────────────────────────────────────────
