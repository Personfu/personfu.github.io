<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODES // NETWORK MAP</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#00e8ff;font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden}
a{color:#00e8ff;text-decoration:none}
.back{position:fixed;top:16px;left:16px;z-index:100;font-family:'VT323',monospace;font-size:22px;padding:6px 16px;border:1px solid #00e8ff;background:rgba(0,232,255,.08);transition:.3s}
.back:hover{background:#00e8ff;color:#02070d}
h1{text-align:center;font-family:'VT323',monospace;font-size:48px;padding:24px 0 8px;text-shadow:0 0 20px #00e8ff}
.subtitle{text-align:center;color:#ff2bd6;font-size:14px;margin-bottom:12px}
#netCanvas{display:block;margin:0 auto;cursor:crosshair}
#infoPanel{position:fixed;right:20px;top:50%;transform:translateY(-50%);width:300px;background:rgba(2,7,13,.95);border:1px solid #00e8ff;padding:20px;display:none;font-size:14px;box-shadow:0 0 30px rgba(0,232,255,.2);z-index:50}
#infoPanel h2{font-family:'VT323',monospace;font-size:32px;margin-bottom:12px}
#infoPanel .field{margin:8px 0}
#infoPanel .label{color:#ff2bd6;font-size:12px}
#infoPanel .val{color:#00ff9c;font-size:16px}
#infoPanel .close{position:absolute;top:8px;right:12px;cursor:pointer;font-size:24px;color:#ff2bd6}
.legend{display:flex;justify-content:center;gap:24px;padding:8px;font-size:13px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<a href="/CyberWorld/" class="back">&#9664; BACK</a>
<h1>NODES // NETWORK MAP</h1>
<p class="subtitle">[ CLICK NODE FOR INTEL ]</p>
<div class="legend">
<span><span class="dot" style="background:#00e8ff"></span>Mainframe</span>
<span><span class="dot" style="background:#ffb347"></span>LAN</span>
<span><span class="dot" style="background:#ff2bd6"></span>Darknet</span>
<span><span class="dot" style="background:#ff3366"></span>Stormcore</span>
</div>
<canvas id="netCanvas"></canvas>
<div id="infoPanel">
<span class="close" onclick="document.getElementById('infoPanel').style.display='none'">&times;</span>
<h2 id="pName"></h2>
<div class="field"><div class="label">SECTOR</div><div class="val" id="pSector"></div></div>
<div class="field"><div class="label">IP ADDRESS</div><div class="val" id="pIP"></div></div>
<div class="field"><div class="label">SERVICE 1</div><div class="val" id="pSvc1"></div></div>
<div class="field"><div class="label">SERVICE 2</div><div class="val" id="pSvc2"></div></div>
<div class="field"><div class="label">STATUS</div><div class="val" id="pStatus"></div></div>
</div>
<script>
const canvas=document.getElementById('netCanvas');
const ctx=canvas.getContext('2d');
const W=Math.min(window.innerWidth-40,900),H=620;
canvas.width=W;canvas.height=H;

const sectors=[
{name:'Mainframe',color:'#00e8ff',cx:W*0.25,cy:H*0.28,nodes:[
{id:'GATE-01',ip:'10.1.0.1',svc:['DNS','DHCP'],status:'ONLINE'},
{id:'CORE-DB',ip:'10.1.0.10',svc:['PostgreSQL','SSH'],status:'ONLINE'},
{id:'ACAD-SRV',ip:'10.1.0.20',svc:['HTTP','HTTPS'],status:'ONLINE'},
{id:'LOG-01',ip:'10.1.0.30',svc:['Syslog','SNMP'],status:'ONLINE'}
]},
{name:'LAN',color:'#ffb347',cx:W*0.75,cy:H*0.28,nodes:[
{id:'FARM-GW',ip:'10.2.0.1',svc:['Router','Firewall'],status:'ONLINE'},
{id:'CRED-VAULT',ip:'10.2.0.15',svc:['LDAP','Kerberos'],status:'SECURED'},
{id:'DHCP-MKT',ip:'10.2.0.25',svc:['DHCP','DNS'],status:'ONLINE'},
{id:'HONYPOT-01',ip:'10.2.0.99',svc:['SSH','HTTP'],status:'DECOY'}
]},
{name:'Darknet',color:'#ff2bd6',cx:W*0.25,cy:H*0.72,nodes:[
{id:'TOR-RELAY',ip:'10.3.0.1',svc:['SOCKS','Tor'],status:'HIDDEN'},
{id:'BAZAAR-DB',ip:'10.3.0.10',svc:['MongoDB','Redis'],status:'ONLINE'},
{id:'CARTEL-NODE',ip:'10.3.0.50',svc:['Custom','P2P'],status:'ENCRYPTED'},
{id:'SHADOW-PROXY',ip:'10.3.0.77',svc:['Proxy','VPN'],status:'MASKED'}
]},
{name:'Stormcore',color:'#ff3366',cx:W*0.75,cy:H*0.72,nodes:[
{id:'ICE-WALL',ip:'10.4.0.1',svc:['IDS','Firewall'],status:'FORTIFIED'},
{id:'RAID-CMD',ip:'10.4.0.10',svc:['C2','SSH'],status:'RESTRICTED'},
{id:'STORM-CORE',ip:'10.4.0.100',svc:['Custom','Encrypted'],status:'CRITICAL'},
{id:'AXIOM-NODE',ip:'10.4.0.200',svc:['Unknown','Unknown'],status:'??? UNKNOWN ???'}
]}
];

const allNodes=[];
const offsets=[[-60,-45],[60,-45],[-60,45],[60,45]];
sectors.forEach(s=>{
s.nodes.forEach((n,i)=>{
n.x=s.cx+offsets[i][0]*1.4;
n.y=s.cy+offsets[i][1]*1.3;
n.color=s.color;
n.sector=s.name;
n.r=24;
allNodes.push(n);
});
});

const connections=[];
sectors.forEach(s=>{
const ns=s.nodes;
for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++)connections.push([ns[i],ns[j]]);
});
connections.push([sectors[0].nodes[0],sectors[1].nodes[0]]);
connections.push([sectors[1].nodes[0],sectors[3].nodes[0]]);
connections.push([sectors[0].nodes[0],sectors[2].nodes[0]]);
connections.push([sectors[2].nodes[0],sectors[3].nodes[0]]);

let pulse=0;
function draw(){
ctx.clearRect(0,0,W,H);
pulse+=0.03;
connections.forEach(([a,b])=>{
ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
ctx.strokeStyle='rgba(0,232,255,0.1)';ctx.lineWidth=1;ctx.stroke();
});
sectors.forEach(s=>{
ctx.fillStyle=s.color;ctx.font='16px VT323';ctx.textAlign='center';
ctx.fillText('[ '+s.name.toUpperCase()+' ]',s.cx,s.cy-85);
});
allNodes.forEach(n=>{
const glow=Math.sin(pulse+n.x*0.01)*0.3+0.7;
ctx.save();
ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
ctx.fillStyle='rgba(2,7,13,0.9)';ctx.fill();
ctx.strokeStyle=n.color;ctx.lineWidth=2;ctx.globalAlpha=glow;
ctx.shadowColor=n.color;ctx.shadowBlur=12;ctx.stroke();
ctx.restore();
ctx.fillStyle=n.color;ctx.font='11px Share Tech Mono';ctx.textAlign='center';
ctx.fillText(n.id,n.x,n.y+4);
});
requestAnimationFrame(draw);
}
draw();

canvas.addEventListener('click',e=>{
const rect=canvas.getBoundingClientRect();
const mx=e.clientX-rect.left,my=e.clientY-rect.top;
for(const n of allNodes){
if(Math.hypot(mx-n.x,my-n.y)<n.r+8){
document.getElementById('pName').textContent=n.id;
document.getElementById('pName').style.color=n.color;
document.getElementById('pSector').textContent=n.sector;
document.getElementById('pIP').textContent=n.ip;
document.getElementById('pSvc1').textContent=n.svc[0];
document.getElementById('pSvc2').textContent=n.svc[1];
document.getElementById('pStatus').textContent=n.status;
document.getElementById('infoPanel').style.display='block';
return;
}
}
});
</script>
</body>
</html>
