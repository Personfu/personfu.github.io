<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODES // NETWORK MAP</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#00e8ff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100vh}
a{color:#00e8ff;text-decoration:none}
a:hover{color:#ff2bd6}
#top-bar{position:fixed;top:0;left:0;right:0;z-index:10;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(2,7,13,.9);border-bottom:1px solid #00e8ff33}
#top-bar h1{font-family:'VT323',monospace;font-size:28px;letter-spacing:3px}
canvas{display:block;cursor:grab}
#info-panel{position:fixed;right:20px;top:60px;width:320px;background:rgba(2,7,13,.95);border:1px solid #00e8ff55;padding:20px;display:none;border-radius:4px;font-size:14px}
#info-panel h2{font-family:'VT323',monospace;font-size:24px;margin-bottom:10px;color:#ff2bd6}
#info-panel .field{margin:6px 0}
#info-panel .label{color:#ffb347;font-size:12px}
#info-panel .value{color:#00ff9c}
.legend{position:fixed;left:20px;bottom:20px;background:rgba(2,7,13,.9);border:1px solid #00e8ff33;padding:12px;font-size:12px;border-radius:4px}
.legend div{margin:3px 0;display:flex;align-items:center;gap:8px}
.legend span{display:inline-block;width:12px;height:12px;border-radius:50%}
</style>
</head>
<body>
<div id="top-bar">
<h1>NODES // NETWORK MAP</h1>
<a href="/CyberWorld/">&#8592; Back to CyberWorld</a>
</div>
<canvas id="c"></canvas>
<div id="info-panel">
<h2 id="ip-host"></h2>
<div class="field"><div class="label">IP ADDRESS</div><div class="value" id="ip-addr"></div></div>
<div class="field"><div class="label">SECTOR</div><div class="value" id="ip-sector"></div></div>
<div class="field"><div class="label">STATUS</div><div class="value" id="ip-status"></div></div>
<div class="field"><div class="label">SERVICES</div><div class="value" id="ip-services"></div></div>
<div class="field"><div class="label">OS</div><div class="value" id="ip-os"></div></div>
<div class="field"><div class="label">NOTES</div><div class="value" id="ip-notes"></div></div>
</div>
<div class="legend">
<div><span style="background:#00e8ff"></span> MAINFRAME CORE</div>
<div><span style="background:#00ff9c"></span> LAN VALLEY</div>
<div><span style="background:#ff2bd6"></span> DARKNET DEPTHS</div>
<div><span style="background:#ffb347"></span> STORMCORE</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

const sectors=[
{name:'MAINFRAME CORE',color:'#00e8ff',cx:0.3,cy:0.35},
{name:'LAN VALLEY',color:'#00ff9c',cx:0.7,cy:0.3},
{name:'DARKNET DEPTHS',color:'#ff2bd6',cx:0.3,cy:0.7},
{name:'STORMCORE',color:'#ffb347',cx:0.7,cy:0.7}
];

const nodeData=[
{host:'CORE-ALPHA',ip:'10.0.1.1',sector:0,services:'SSH, HTTPS, DNS',os:'GridOS 4.2',status:'ONLINE',notes:'Primary mainframe. Houses the Axiom kernel.',ox:-0.04,oy:-0.04},
{host:'CORE-BETA',ip:'10.0.1.2',sector:0,services:'HTTPS, LDAP',os:'GridOS 4.2',status:'ONLINE',notes:'Backup mainframe. Redundant cluster node.',ox:0.04,oy:-0.04},
{host:'CORE-RELAY',ip:'10.0.1.3',sector:0,services:'SSH, NTP',os:'GridOS 4.1',status:'ONLINE',notes:'Time synchronization relay for all sectors.',ox:-0.04,oy:0.04},
{host:'CORE-VAULT',ip:'10.0.1.4',sector:0,services:'HTTPS, SFTP',os:'GridOS 4.2',status:'RESTRICTED',notes:'Encrypted data vault. Level 8 clearance required.',ox:0.04,oy:0.04},
{host:'CORE-MONITOR',ip:'10.0.1.5',sector:0,services:'SNMP, Syslog, HTTPS',os:'GridOS 4.2',status:'ONLINE',notes:'Central monitoring dashboard for GRIDWATCH ops.',ox:0,oy:0.07},
{host:'LAN-GW01',ip:'10.0.2.1',sector:1,services:'HTTP, DHCP, DNS',os:'ValleyOS 2.8',status:'ONLINE',notes:'Primary gateway for LAN Valley residents.',ox:-0.05,oy:-0.03},
{host:'LAN-PROXY',ip:'10.0.2.2',sector:1,services:'HTTP Proxy, TLS',os:'ValleyOS 2.8',status:'ONLINE',notes:'Content filtering proxy. Blocks known malware domains.',ox:0.05,oy:-0.03},
{host:'LAN-FILESERV',ip:'10.0.2.3',sector:1,services:'SMB, NFS, FTP',os:'ValleyOS 2.7',status:'ONLINE',notes:'Community file share. Public codex archives.',ox:-0.03,oy:0.04},
{host:'LAN-DEVBOX',ip:'10.0.2.4',sector:1,services:'SSH, Git, Docker',os:'ValleyOS 2.8',status:'ONLINE',notes:'Developer sandbox. Patch Kid frequents here.',ox:0.03,oy:0.04},
{host:'LAN-RADIO',ip:'10.0.2.5',sector:1,services:'UDP 8000, HTTPS',os:'ValleyOS 2.8',status:'ONLINE',notes:'DJ Cache broadcast tower. Streams Grid Radio.',ox:0,oy:-0.06},
{host:'DARK-ONION1',ip:'10.0.3.1',sector:2,services:'Tor, SSH',os:'ShadowOS 1.3',status:'HIDDEN',notes:'Phantom Syndicate entry node. Heavily obfuscated.',ox:-0.04,oy:-0.04},
{host:'DARK-MARKET',ip:'10.0.3.2',sector:2,services:'HTTPS, Crypto-RPC',os:'ShadowOS 1.3',status:'HIDDEN',notes:'Underground marketplace. Cipher Nox operates here.',ox:0.04,oy:-0.04},
{host:'DARK-C2',ip:'10.0.3.3',sector:2,services:'Custom 4444, DNS-Tunnel',os:'ShadowOS 1.4',status:'COMPROMISED',notes:'Suspected daemon C2 server. Under investigation.',ox:-0.04,oy:0.04},
{host:'DARK-ARCHIVE',ip:'10.0.3.4',sector:2,services:'IPFS, SSH',os:'ShadowOS 1.3',status:'HIDDEN',notes:'Decentralized archive. Pre-Axiom data fragments.',ox:0.04,oy:0.04},
{host:'DARK-WHISPER',ip:'10.0.3.5',sector:2,services:'IRC, XMPP',os:'ShadowOS 1.2',status:'INTERMITTENT',notes:'Encrypted comms relay. Signal degrades near Stormcore.',ox:0,oy:0.06},
{host:'STORM-NEXUS',ip:'10.0.4.1',sector:3,services:'HTTPS, API-GW',os:'NexusCore 3.0',status:'ONLINE',notes:'Nexus Corp headquarters node. Corporate firewall.',ox:-0.04,oy:-0.04},
{host:'STORM-FORGE',ip:'10.0.4.2',sector:3,services:'SSH, GPU-Compute',os:'NexusCore 3.0',status:'ONLINE',notes:'AI training cluster. Daemon research facility.',ox:0.04,oy:-0.04},
{host:'STORM-SENTINEL',ip:'10.0.4.3',sector:3,services:'Custom 9999',os:'NexusCore 3.1',status:'DANGER',notes:'Sentinel daemon containment unit. Approach with caution.',ox:-0.04,oy:0.04},
{host:'STORM-UPLINK',ip:'10.0.4.4',sector:3,services:'Satellite-Link, HTTPS',os:'NexusCore 3.0',status:'ONLINE',notes:'External uplink. Connects Grid to outside networks.',ox:0.04,oy:0.04},
{host:'STORM-BACKUP',ip:'10.0.4.5',sector:3,services:'SFTP, Rsync',os:'NexusCore 2.9',status:'DEGRADED',notes:'Backup node. Storage at 94% capacity.',ox:0,oy:-0.06}
];

const edges=[[0,1],[0,2],[1,3],[2,4],[3,4],[5,6],[6,7],[7,8],[8,9],[5,9],[10,11],[11,12],[12,13],[13,14],[10,14],[15,16],[16,17],[17,18],[18,19],[15,19],[0,5],[3,15],[2,10],[14,17],[4,9],[9,6],[13,12],[7,16]];

let zoom=1,panX=0,panY=0,dragging=false,dragStartX,dragStartY,selectedNode=null;

function getNodePos(i){
const n=nodeData[i],s=sectors[n.sector];
return{x:(s.cx+n.ox)*W,y:(s.cy+n.oy)*H};
}

let pulses=[];
function spawnPulse(){
const e=edges[Math.floor(Math.random()*edges.length)];
pulses.push({from:e[0],to:e[1],t:0,speed:0.005+Math.random()*0.01});
}
setInterval(spawnPulse,400);

let time=0;
function draw(){
time++;
ctx.setTransform(1,0,0,1,0,0);
ctx.clearRect(0,0,W,H);
ctx.setTransform(zoom,0,0,zoom,W/2+panX,H/2+panY);
ctx.translate(-W/2,-H/2);

edges.forEach(([a,b])=>{
const pa=getNodePos(a),pb=getNodePos(b);
ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
ctx.strokeStyle='rgba(0,232,255,0.12)';ctx.lineWidth=1;ctx.stroke();
});

pulses=pulses.filter(p=>{
p.t+=p.speed;if(p.t>1)return false;
const pa=getNodePos(p.from),pb=getNodePos(p.to);
const x=pa.x+(pb.x-pa.x)*p.t,y=pa.y+(pb.y-pa.y)*p.t;
ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
ctx.fillStyle='rgba(0,255,156,0.8)';ctx.fill();
return true;
});

nodeData.forEach((n,i)=>{
const p=getNodePos(i),col=sectors[n.sector].color;
const r=selectedNode===i?14:10,pulse=Math.sin(time*0.05+i)*2;
ctx.beginPath();ctx.arc(p.x,p.y,r+pulse,0,Math.PI*2);
ctx.fillStyle=col+'22';ctx.fill();
ctx.strokeStyle=col;ctx.lineWidth=selectedNode===i?2.5:1.5;ctx.stroke();
ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
ctx.fillStyle=col;ctx.font='10px Share Tech Mono';ctx.textAlign='center';
ctx.fillText(n.host,p.x,p.y-16);
});
requestAnimationFrame(draw);
}
draw();

canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(5,zoom*(e.deltaY>0?0.9:1.1)))});
canvas.addEventListener('mousedown',e=>{dragging=true;dragStartX=e.clientX-panX;dragStartY=e.clientY-panY;canvas.style.cursor='grabbing'});
canvas.addEventListener('mousemove',e=>{if(dragging){panX=e.clientX-dragStartX;panY=e.clientY-dragStartY}});
canvas.addEventListener('mouseup',()=>{dragging=false;canvas.style.cursor='grab'});

canvas.addEventListener('click',e=>{
const mx=(e.clientX-W/2-panX)/zoom+W/2,my=(e.clientY-H/2-panY)/zoom+H/2;
let found=-1,minD=900;
nodeData.forEach((n,i)=>{const p=getNodePos(i),d=Math.hypot(p.x-mx,p.y-my);if(d<25&&d<minD){minD=d;found=i}});
if(found>=0){
selectedNode=found;const n=nodeData[found];
document.getElementById('ip-host').textContent=n.host;
document.getElementById('ip-addr').textContent=n.ip;
document.getElementById('ip-sector').textContent=sectors[n.sector].name;
document.getElementById('ip-status').textContent=n.status;
document.getElementById('ip-services').textContent=n.services;
document.getElementById('ip-os').textContent=n.os;
document.getElementById('ip-notes').textContent=n.notes;
document.getElementById('info-panel').style.display='block';
const sc=n.status;
document.getElementById('ip-status').style.color=sc==='ONLINE'?'#00ff9c':sc==='DANGER'||sc==='COMPROMISED'?'#ff2bd6':'#ffb347';
}else{selectedNode=null;document.getElementById('info-panel').style.display='none'}
});
</script>
</body>
</html>
