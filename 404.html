<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>CyberWorld :: Route Alias</title>
  <style>
    :root {
      --cyan: #00ffe7;
      --pink: #ff0055;
      --green: #58ff9a;
      --text: #effff8;
      --muted: #8fa9a2;
      --panel: rgba(6, 12, 18, 0.94);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(88, 255, 154, 0.22), rgba(0, 0, 0, 0) 34%),
        linear-gradient(135deg, #020704 0%, #05120f 46%, #10131d 100%);
      font-family: "Courier New", Consolas, ui-monospace, monospace;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(88, 255, 154, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88, 255, 154, 0.06) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100vw - 32px));
      padding: 26px;
      border: 1px solid rgba(0, 255, 231, 0.36);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(12, 20, 18, 0.96), rgba(5, 10, 16, 0.98)), var(--panel);
      box-shadow:
        0 0 30px rgba(88, 255, 154, 0.14),
        inset 0 0 24px rgba(0, 255, 231, 0.05);
    }
    h1 {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: clamp(1.7rem, 4.8vw, 2.4rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    p {
      margin: 0 0 12px;
      color: var(--text);
      line-height: 1.65;
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    a {
      display: inline-grid;
      place-items: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 231, 0.55);
      color: var(--text);
      background: #061019;
      text-decoration: none;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    a.primary {
      color: #041010;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      border-color: transparent;
      font-weight: 800;
    }
    a:hover { border-color: var(--pink); color: var(--cyan); }
    a.primary:hover { color: #051018; }
    code { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Route Alias</h1>
    <p id="message">Resolving the requested CyberWorld path...</p>
    <p class="meta">This page catches lower-case routes and forwards them to the existing training pages on GitHub Pages.</p>
    <div class="links">
      <a class="primary" href="/cyberworld.html">Open CyberWorld</a>
      <a href="/CyberWorld/login/">Open login matrix</a>
      <a href="/CyberWorld_login/">Open training gate</a>
    </div>
  </main>
  <script>
  (() => {
    const path = (location.pathname || "").toLowerCase();
    const targets = [
      { prefix: "/cyberworld/login", target: "/CyberWorld/login/" },
      { prefix: "/cyberworld", target: "/cyberworld.html" },
    ];
    for (const route of targets) {
      if (path === route.prefix || path === route.prefix + "/" || path.startsWith(route.prefix + "/")) {
        location.replace(route.target);
        return;
      }
    }
    const message = document.getElementById("message");
    message.textContent = "This route is not mapped yet. Use the links below to enter the range.";
  })();
  </script>
</body>
</html>
