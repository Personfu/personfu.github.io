<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CyberWorld MMORPG</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02070d;font-family:'Share Tech Mono',monospace;color:#dffbff}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
 background:linear-gradient(180deg,rgba(2,7,13,.7) 0%,rgba(2,7,13,.3) 70%,transparent 100%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-left,.hud-right{display:flex;gap:8px;align-items:flex-start;pointer-events:auto}
.hud-bar{width:140px}
.hud-bar .lbl{font-size:9px;letter-spacing:2px;color:#a8c8d8;display:flex;justify-content:space-between}
.hud-bar .track{height:8px;background:#06101a;border:1px solid #00e8ff33;border-radius:2px;overflow:hidden;margin-top:2px;position:relative}
.hud-bar .fill{height:100%;border-radius:1px;transition:width .3s;position:relative}
.hud-bar .fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.15) 50%,transparent 100%);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.fill-hp{background:linear-gradient(90deg,#00ff9c,#00e8ff)}
.fill-shield{background:linear-gradient(90deg,#ff2bd6,#a855f7)}
.fill-xp{background:linear-gradient(90deg,#ffb347,#ff6b35)}
.fill-noise{background:linear-gradient(90deg,#ffb347,#ff2222)}
#hud-sector{font-family:'VT323',monospace;font-size:16px;color:#00e8ff;letter-spacing:3px;text-shadow:0 0 8px #00e8ff44;border-bottom:1px solid #00e8ff44;padding-bottom:2px;display:inline-block}
#hud-level{font-family:'VT323',monospace;font-size:14px;color:#00ff9c}
#hud-credits{font-size:11px;color:#ffb347}
#hud-noise-ambient{margin-top:4px}
#minimap{width:120px;height:90px;background:#02070d;border:1px solid #00e8ff44;border-radius:4px;image-rendering:pixelated;pointer-events:auto}
#toast-area{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{padding:6px 16px;background:rgba(10,10,18,.92);border:1px solid #00ff9c66;border-radius:4px;font-size:12px;color:#00ff9c;letter-spacing:1px;animation:toastIn .3s ease,toastOut .4s ease 2.2s forwards;white-space:nowrap;backdrop-filter:blur(4px)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

/* COMBAT OVERLAY — dramatic full-screen */
#combat-overlay{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;font-family:'Share Tech Mono',monospace;overflow:hidden}
#combat-overlay.active{display:flex}
#combat-bg{position:absolute;inset:0;z-index:0}
.cb-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:16px}
.cb-turn-indicator{font-family:'VT323',monospace;font-size:20px;letter-spacing:4px;height:28px;margin-bottom:8px;transition:color .3s}
.cb-turn-indicator.player-turn{color:#00ff9c;text-shadow:0 0 10px #00ff9c66}
.cb-turn-indicator.enemy-turn{color:#ff2bd6;text-shadow:0 0 10px #ff2bd666}
.cb-main-area{display:flex;align-items:flex-start;justify-content:center;gap:32px;width:100%;max-width:700px;margin-bottom:16px}
.cb-player-stats,.cb-enemy-stats{width:160px;flex-shrink:0}
.cb-stat-name{font-family:'VT323',monospace;font-size:16px;letter-spacing:2px;margin-bottom:4px}
.cb-stat-name.player-name{color:#00e8ff}
.cb-stat-name.enemy-name-tag{color:#ff2bd6}
.cb-stat-class{font-size:9px;color:#a8c8d8;margin-bottom:8px;letter-spacing:1px}
.cb-stat-bar{margin-bottom:6px}
.cb-stat-bar .sbl{font-size:9px;color:#a8c8d8;display:flex;justify-content:space-between}
.cb-stat-bar .sbt{height:8px;background:#06101a;border:1px solid #00e8ff33;border-radius:2px;overflow:hidden;margin-top:2px}
.cb-stat-bar .sbf{height:100%;border-radius:1px;transition:width .3s}
.cb-stat-bar .sbf.flash{animation:barFlash .3s}
@keyframes barFlash{0%{filter:brightness(3)}100%{filter:brightness(1)}}
.cb-enemy-sprite-area{width:160px;height:160px;position:relative;flex-shrink:0}
#cb-esprite{width:160px;height:160px}
.cb-float-dmg{position:absolute;font-family:'VT323',monospace;font-size:22px;pointer-events:none;animation:floatUp 1s ease-out forwards;z-index:5}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.cb-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:340px;max-width:90vw;margin-bottom:12px}
.cb-btn{padding:12px 8px;background:rgba(6,16,26,.8);border:1px solid #00e8ff66;color:#00e8ff;font-family:inherit;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:6px;transition:all .2s;text-align:center;backdrop-filter:blur(4px);position:relative;overflow:hidden}
.cb-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,232,255,.05),transparent);pointer-events:none}
.cb-btn:hover:not(:disabled){background:rgba(10,24,40,.9);border-color:#00ff9c;color:#00ff9c;box-shadow:0 0 16px #00ff9c22}
.cb-btn:disabled{opacity:.3;cursor:default;filter:grayscale(.5)}
.cb-btn .verb{font-family:'VT323',monospace;font-size:18px;display:block;margin-bottom:2px}
.cb-btn .glyph{font-size:20px;display:block;margin-bottom:4px}
.cb-btn .desc{font-size:9px;color:#6fdfff;letter-spacing:.5px}
.cb-log{width:340px;max-width:90vw;max-height:90px;overflow-y:auto;font-size:10px;color:#a8c8d8;padding:8px;background:rgba(6,16,26,.8);border:1px solid #00e8ff22;border-radius:4px;margin-bottom:8px;line-height:1.6;backdrop-filter:blur(4px)}
.cb-log .hit{color:#ff2bd6}.cb-log .heal{color:#00ff9c}.cb-log .info{color:#ffb347}.cb-log .warn{color:#ff4444}

/* Screen flash overlay for combat hits */
#combat-flash{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .1s}

#counter-card{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(2,7,13,.95)}
#counter-card.active{display:flex}
.cc-inner{max-width:500px;width:90vw;background:rgba(10,10,18,.95);border:1px solid #00ff9c;border-radius:10px;padding:24px;box-shadow:0 0 40px #00ff9c22;backdrop-filter:blur(8px)}
.cc-inner h2{font-family:'VT323',monospace;font-size:24px;color:#00ff9c;letter-spacing:3px;margin-bottom:4px}
.cc-inner h3{font-size:12px;color:#ff2bd6;letter-spacing:2px;margin-bottom:12px}
.cc-inner .cc-section{margin:10px 0}
.cc-inner .cc-label{font-size:10px;color:#ffb347;letter-spacing:2px;margin-bottom:4px}
.cc-inner .cc-text{font-size:12px;color:#c8d6e5;line-height:1.6}
.cc-inner button{margin-top:16px;padding:8px 24px;background:#06101a;color:#00e8ff;border:1px solid #00e8ff66;font-family:inherit;letter-spacing:2px;cursor:pointer;border-radius:4px;font-size:12px;transition:all .2s}
.cc-inner button:hover{background:#0a1828;border-color:#00ff9c;color:#00ff9c;box-shadow:0 0 12px #00ff9c22}

/* DIALOGUE — with portrait area */
#dialogue-box{position:fixed;bottom:0;left:0;right:0;z-index:20;display:none;padding:12px;animation:dlgSlideIn .2s ease}
#dialogue-box.active{display:block}
@keyframes dlgSlideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.dlg-inner{max-width:700px;margin:0 auto;background:rgba(10,10,18,.92);border:1px solid #00e8ff66;border-radius:8px;padding:16px 20px;backdrop-filter:blur(8px);display:flex;gap:16px;align-items:flex-start}
.dlg-inner.quest-border{border-color:#ffb347}
.dlg-portrait{width:60px;height:60px;flex-shrink:0;border-radius:6px;border:1px solid #00e8ff44;overflow:hidden}
.dlg-portrait canvas{width:60px;height:60px}
.dlg-body{flex:1;min-width:0}
.dlg-name{font-family:'VT323',monospace;font-size:18px;letter-spacing:2px;margin-bottom:6px;display:inline-block;padding:2px 8px;border-radius:3px}
.dlg-text{font-size:13px;color:#dffbff;line-height:1.7;min-height:40px}
.dlg-hint{font-size:10px;color:#6fdfff;text-align:right;margin-top:6px;letter-spacing:1px}
.dlg-choices{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dlg-choice{padding:6px 14px;background:#06101a;border:1px solid #00e8ff44;color:#00e8ff;cursor:pointer;border-radius:4px;font-family:inherit;font-size:11px;letter-spacing:1px;transition:all .2s}
.dlg-choice:hover{border-color:#00ff9c;color:#00ff9c;box-shadow:0 0 8px #00ff9c22}

/* MENU — glass-morphism with fade */
#menu-overlay{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(2,7,13,.88);backdrop-filter:blur(6px);animation:menuFadeIn .2s ease}
#menu-overlay.active{display:flex}
@keyframes menuFadeIn{from{opacity:0}to{opacity:1}}
.menu-panel{width:640px;max-width:94vw;max-height:80vh;background:rgba(10,10,18,.95);border:1px solid #00e8ff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(8px);box-shadow:0 0 40px rgba(0,232,255,.08)}
.menu-tabs{display:flex;border-bottom:1px solid #00e8ff44;padding:0 4px;overflow-x:auto;flex-shrink:0}
.menu-tab{padding:10px 14px;font-family:'VT323',monospace;font-size:15px;letter-spacing:2px;color:#6fdfff;cursor:pointer;border:none;background:none;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:4px}
.menu-tab:hover{color:#00e8ff}
.menu-tab.active{color:#00ff9c;box-shadow:inset 0 -2px 0 #00ff9c}
.menu-tab .tab-icon{font-size:14px}
.menu-body{padding:16px;overflow-y:auto;flex:1;font-size:12px;line-height:1.7;color:#c8d6e5}
.menu-body h3{font-family:'VT323',monospace;font-size:20px;color:#00e8ff;letter-spacing:2px;margin:0 0 10px}
.menu-body .quest-item{padding:8px;margin:6px 0;background:#06101a;border:1px solid #00e8ff22;border-radius:4px;cursor:pointer;transition:border-color .15s}
.menu-body .quest-item:hover{border-color:#00e8ff}
.menu-body .quest-item .qt{color:#00e8ff;font-size:13px}
.menu-body .quest-item .qb{color:#a8c8d8;font-size:11px;margin-top:4px}
.menu-body .quest-item.done{opacity:.5;border-left:3px solid #00ff9c}
.menu-body .quest-item.done .qt::after{content:' ✓';color:#00ff9c}
.menu-body .quest-item.available{border-left:3px solid #ffb347}
.menu-body .quest-item.locked{border-left:3px solid #555}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.inv-slot{padding:8px;background:#06101a;border:1px solid #00e8ff22;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s}
.inv-slot:hover{border-color:#00ff9c;box-shadow:0 0 8px #00ff9c11}
.inv-slot .iname{color:#00ff9c}
.inv-slot .iqty{color:#ffb347;font-size:10px}
.inv-slot .idesc{color:#888;font-size:10px;margin-top:3px}
.skill-bar{margin:6px 0}
.skill-bar .sk-label{display:flex;justify-content:space-between;font-size:11px}
.skill-bar .sk-track{height:10px;background:#06101a;border:1px solid #00e8ff22;border-radius:2px;overflow:hidden;margin-top:2px}
.skill-bar .sk-fill{height:100%;background:linear-gradient(90deg,#ffb347,#ff6b35);border-radius:1px}
.faction-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #00e8ff11;font-size:12px}
.map-sector{padding:8px;margin:4px 0;background:#06101a;border:1px solid #00e8ff22;border-radius:4px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
.map-sector:hover{border-color:#00e8ff}
.map-sector.current{border-color:#00ff9c;box-shadow:0 0 10px #00ff9c22}
.map-sector .ms-name{color:#00e8ff;font-size:13px}
.map-sector .ms-lvl{color:#ffb347;font-size:10px}
.menu-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#ff2bd6;font-size:20px;cursor:pointer;font-family:'VT323',monospace;transition:color .15s}
.menu-close:hover{color:#ff006e}
#transition-overlay{position:fixed;inset:0;z-index:60;background:#02070d;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
#transition-overlay.active{opacity:1;pointer-events:auto}
#transition-overlay .tr-text{font-family:'VT323',monospace;font-size:32px;color:#00e8ff;letter-spacing:6px;text-shadow:0 0 20px #00e8ff44}
#mobile-controls{position:fixed;bottom:16px;left:16px;z-index:15;display:none;gap:2px;pointer-events:auto}
.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px}
.dpad button{background:rgba(6,16,26,.7);border:1px solid #00e8ff44;color:#00e8ff;font-size:18px;border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;backdrop-filter:blur(4px)}
.dpad button:active{background:#00e8ff33}
.dpad .empty{border:none;background:none}
#mobile-interact{position:fixed;bottom:40px;right:20px;z-index:15;display:none;width:56px;height:56px;border-radius:50%;background:rgba(6,16,26,.7);border:2px solid #00ff9c66;color:#00ff9c;font-family:'VT323',monospace;font-size:14px;letter-spacing:1px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;backdrop-filter:blur(4px)}
@media(max-width:768px){
  #mobile-controls{display:grid}
  #mobile-interact{display:block}
  .hud-bar{width:100px}
  #minimap{width:80px;height:60px}
  .cb-actions{width:90vw}
  .cb-main-area{flex-direction:column;align-items:center;gap:8px}
  .cb-player-stats,.cb-enemy-stats{width:90vw;max-width:340px}
  .cb-enemy-sprite-area{width:120px;height:120px}
  #cb-esprite{width:120px;height:120px}
}
@media(max-width:480px){
  .hud-bar{width:70px}
  .hud-bar .lbl{font-size:7px}
  #hud-sector{font-size:12px}
  #minimap{display:none}
}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);mix-blend-mode:multiply}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="scanlines"></div>
<div id="hud">
 <div class="hud-left">
  <div>
   <div id="hud-sector">MAINFRAME CORE</div>
   <div id="hud-level">TIER 1</div>
   <div id="hud-credits">&#162; 250</div>
   <div id="hud-noise-ambient">
    <div class="hud-bar"><div class="lbl"><span>THREAT</span><span id="noise-val">LOW</span></div><div class="track"><div class="fill fill-noise" id="noise-fill" style="width:10%"></div></div></div>
   </div>
  </div>
  <div>
   <div class="hud-bar"><div class="lbl"><span>HP</span><span id="hp-val">100/100</span></div><div class="track"><div class="fill fill-hp" id="hp-fill" style="width:100%"></div></div></div>
   <div class="hud-bar"><div class="lbl"><span>SHIELD</span><span id="sh-val">30/30</span></div><div class="track"><div class="fill fill-shield" id="sh-fill" style="width:100%"></div></div></div>
   <div class="hud-bar"><div class="lbl"><span>XP</span><span id="xp-val">0/100</span></div><div class="track"><div class="fill fill-xp" id="xp-fill" style="width:0%"></div></div></div>
  </div>
 </div>
 <div class="hud-right">
  <canvas id="minimap" width="120" height="90"></canvas>
 </div>
</div>
<div id="toast-area"></div>
<div id="combat-overlay">
 <canvas id="combat-bg" width="1" height="1"></canvas>
 <div id="combat-flash"></div>
 <div class="cb-content">
  <div class="cb-turn-indicator" id="cb-turn">YOUR TURN</div>
  <div class="cb-main-area">
   <div class="cb-player-stats">
    <div class="cb-stat-name player-name" id="cb-pname">OPERATIVE</div>
    <div class="cb-stat-bar"><div class="sbl"><span>HP</span><span id="cb-php-val"></span></div><div class="sbt"><div class="sbf fill-hp" id="cb-php-fill"></div></div></div>
    <div class="cb-stat-bar"><div class="sbl"><span>SHIELD</span><span id="cb-psh-val"></span></div><div class="sbt"><div class="sbf fill-shield" id="cb-psh-fill"></div></div></div>
    <div class="cb-stat-bar"><div class="sbl"><span>NOISE</span><span id="cb-noise-val">0/100</span></div><div class="sbt"><div class="sbf fill-noise" id="cb-noise-fill" style="width:0%"></div></div></div>
   </div>
   <div class="cb-enemy-sprite-area" id="cb-sprite-area">
    <canvas id="cb-esprite" width="160" height="160"></canvas>
   </div>
   <div class="cb-enemy-stats">
    <div class="cb-stat-name enemy-name-tag" id="cb-ename"></div>
    <div class="cb-stat-class" id="cb-eclass"></div>
    <div class="cb-stat-bar"><div class="sbl"><span>HP</span><span id="cb-ehp-val"></span></div><div class="sbt"><div class="sbf fill-hp" id="cb-ehp-fill"></div></div></div>
   </div>
  </div>
  <div class="cb-actions" id="cb-actions">
   <button class="cb-btn" data-verb="recon"><span class="glyph">&#9678;</span><span class="verb">RECON</span><span class="desc">Scan weakness +5 noise</span></button>
   <button class="cb-btn" data-verb="exploit"><span class="glyph">&#9889;</span><span class="verb">EXPLOIT</span><span class="desc">Attack +15-25 noise</span></button>
   <button class="cb-btn" data-verb="patch"><span class="glyph">&#10010;</span><span class="verb">PATCH</span><span class="desc">Heal +8 noise</span></button>
   <button class="cb-btn" data-verb="run"><span class="glyph">&#8634;</span><span class="verb">RUN</span><span class="desc">Attempt escape</span></button>
  </div>
  <div class="cb-log" id="cb-log"></div>
 </div>
</div>
<div id="counter-card">
 <div class="cc-inner" id="cc-inner"></div>
</div>
<div id="dialogue-box">
 <div class="dlg-inner">
  <div class="dlg-portrait"><canvas id="dlg-portrait-canvas" width="60" height="60"></canvas></div>
  <div class="dlg-body">
   <div class="dlg-name" id="dlg-name"></div>
   <div class="dlg-text" id="dlg-text"></div>
   <div class="dlg-choices" id="dlg-choices"></div>
   <div class="dlg-hint" id="dlg-hint">SPACE to continue</div>
  </div>
 </div>
</div>
<div id="menu-overlay">
 <div class="menu-panel" style="position:relative">
  <button class="menu-close" id="menu-close">&#10005;</button>
  <div class="menu-tabs" id="menu-tabs"></div>
  <div class="menu-body" id="menu-body"></div>
 </div>
</div>
<div id="transition-overlay"><div class="tr-text" id="tr-text"></div></div>
<div id="mobile-controls">
 <div class="dpad">
  <div class="empty"></div><button data-dir="up">&#9650;</button><div class="empty"></div>
  <button data-dir="left">&#9668;</button><div class="empty"></div><button data-dir="right">&#9658;</button>
  <div class="empty"></div><button data-dir="down">&#9660;</button><div class="empty"></div>
 </div>
</div>
<button id="mobile-interact">ACT</button>
<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════
var TS=32,SAVE_KEY='cw.operative.v2';
var TILE={VOID:0,FLOOR:1,WALL:2,TERMINAL:3,DOOR:4,CHEST:5,HEAL:6,WATER:7,CABLE:8,DANGER:9,GLOW:10,SERVER:11};
var MODE={EXPLORE:'explore',COMBAT:'combat',DIALOGUE:'dialogue',MENU:'menu',TRANSITION:'transition'};
var gameMode=MODE.EXPLORE;

// ═══════════════════════════════════════════════════════
// ITEM CATALOG
// ═══════════════════════════════════════════════════════
var ITEMS={
 'PATCH-KIT':{desc:'Emergency nano-patch. Restores 40 HP in combat.',use:'heal',val:40},
 'PORT-MAP':{desc:'Detailed topology of open services on the local subnet.'},
 'PCAP':{desc:'Packet capture containing suspicious network traffic.'},
 'CIPHER-KEY':{desc:'Encrypted key fragment recovered from a hostile node.'},
 'ROOTKIT-SIG':{desc:'Signature file for identifying a known rootkit family.'},
 'STORM-KEY':{desc:'Access credential for the Stormcore outer perimeter.'},
 'ICE-CORE':{desc:'Intrusion Countermeasure Electronics core module.'},
 'HONEYPOT-LOG':{desc:'Logs from a honeypot showing attacker behavior.'},
 'FIREWALL-RULE':{desc:'Optimized ACL that hardens perimeter defenses. +5 shield.',use:'shield',val:5},
 'ZERO-DAY-BRIEF':{desc:'Intel on an unpatched vulnerability in critical infra.'},
 'THREAT-REPORT':{desc:'Comprehensive threat landscape report.'}

function buildMap(name){
 var def=SECTOR_DEFS[name];if(!def)return;
 var w=def.w,h=def.h;
 var map=[];
 for(var y=0;y<h;y++){map[y]=[];for(var x=0;x<w;x++)map[y][x]=TILE.WALL;}
 def.rooms.forEach(function(r){
  for(var ry=r[1];ry<r[1]+r[3]&&ry<h;ry++)
   for(var rx=r[0];rx<r[0]+r[2]&&rx<w;rx++)
    if(ry>0&&ry<h-1&&rx>0&&rx<w-1)map[ry][rx]=TILE.FLOOR;
 });
 def.corridors.forEach(function(c){
  var x1=c[0],y1=c[1],x2=c[2],y2=c[3];
  for(var x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)
   for(var dy=0;dy<2;dy++)if(y1+dy>0&&y1+dy<h-1&&x>0&&x<w-1)map[y1+dy][x]=TILE.FLOOR;
  for(var y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)
   for(var dx=0;dx<2;dx++)if(y>0&&y<h-1&&x2+dx>0&&x2+dx<w-1)map[y][x2+dx]=TILE.FLOOR;
 });
 def.objects.forEach(function(o){if(o.y>0&&o.y<h&&o.x>0&&o.x<w)map[o.y][o.x]=o.t;});
 def.doors.forEach(function(d){if(d.y>=0&&d.y<h&&d.x>=0&&d.x<w)map[d.y][d.x]=TILE.DOOR;});
 if(def.danger)def.danger.forEach(function(z){
  for(var zy=z[1];zy<z[1]+z[3]&&zy<h;zy++)
   for(var zx=z[0];zx<z[0]+z[2]&&zx<w;zx++)
    if(map[zy][zx]===TILE.FLOOR)map[zy][zx]=TILE.DANGER;
 });
 currentMap=map;mapW=w;mapH=h;
 tileDetailSeed={};
}

var audioCtx=null;
function getAudio(){
 if(audioCtx)return audioCtx;
 try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
 return audioCtx;
}
function tone(freq,dur,type,gain){
 var ctx=getAudio();if(!ctx)return;
 try{var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain||.04,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+(dur||.1));
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+(dur||.1)+.02);
 }catch(e){}
}

// Helper: parse hex color to rgb
function hexToRgb(hex){
 var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
 return{r:r,g:g,b:b};

function drawTile(type,sx,sy,theme){
 var detail;
 switch(type){
  case TILE.FLOOR:
   // Gradient floor with circuit details
   var grd=ctx.createLinearGradient(sx,sy,sx+TS,sy+TS);
   grd.addColorStop(0,theme.floor);
   grd.addColorStop(1,theme.grid);
   ctx.fillStyle=grd;ctx.fillRect(sx,sy,TS,TS);
   // Subtle grid line
   ctx.strokeStyle=theme.grid;ctx.lineWidth=0.3;ctx.strokeRect(sx+0.5,sy+0.5,TS-1,TS-1);
   // Circuit trace details at 10% opacity
   detail=getTileDetail(Math.floor((sx+camX)/TS),Math.floor((sy+camY)/TS));
   if(detail<0.15){
    ctx.strokeStyle=theme.accent;ctx.globalAlpha=0.08;ctx.lineWidth=0.5;
    ctx.beginPath();
    if(detail<0.05){ctx.moveTo(sx+4,sy+TS/2);ctx.lineTo(sx+TS-4,sy+TS/2);}
    else if(detail<0.1){ctx.moveTo(sx+TS/2,sy+4);ctx.lineTo(sx+TS/2,sy+TS-4);}
    else{ctx.moveTo(sx+4,sy+4);ctx.lineTo(sx+TS-4,sy+TS-4);}
    ctx.stroke();ctx.globalAlpha=1;
   }
   break;
  case TILE.WALL:
   // Dark gradient with 3D highlight
   var wgrd=ctx.createLinearGradient(sx,sy,sx,sy+TS);
   wgrd.addColorStop(0,theme.wall);
   var rgb=hexToRgb(theme.wall);
   wgrd.addColorStop(1,'rgb('+(rgb.r-15)+','+(rgb.g-15)+','+(rgb.b-15)+')');
   ctx.fillStyle=wgrd;ctx.fillRect(sx,sy,TS,TS);
   // Top highlight edge
   ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(sx,sy,TS,2);
   // Panel lines
   ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;
   ctx.beginPath();ctx.moveTo(sx,sy+TS*0.5);ctx.lineTo(sx+TS,sy+TS*0.5);ctx.stroke();
   ctx.beginPath();ctx.moveTo(sx+TS*0.5,sy);ctx.lineTo(sx+TS*0.5,sy+TS);ctx.stroke();
   // Rivet details
   detail=getTileDetail(Math.floor((sx+camX)/TS),Math.floor((sy+camY)/TS));
   if(detail<0.2){
    ctx.fillStyle='rgba(255,255,255,0.04)';
    ctx.fillRect(sx+3,sy+3,2,2);ctx.fillRect(sx+TS-5,sy+3,2,2);
    ctx.fillRect(sx+3,sy+TS-5,2,2);ctx.fillRect(sx+TS-5,sy+TS-5,2,2);
   }
   break;
  case TILE.TERMINAL:
   // Floor underneath
   ctx.fillStyle=theme.floor;ctx.fillRect(sx,sy,TS,TS);
   // Terminal body
   ctx.fillStyle=theme.terminal;ctx.fillRect(sx+3,sy+3,TS-6,TS-8);
   // Screen with scrolling text
   var fl=Math.sin(renderTick*0.06)*0.3+0.7;
   ctx.fillStyle=theme.termGlow;ctx.globalAlpha=fl*0.3;
   ctx.fillRect(sx+5,sy+5,TS-10,TS-12);
   ctx.globalAlpha=fl*0.8;
   // Matrix-style scrolling chars
   ctx.font='6px monospace';ctx.fillStyle=theme.termGlow;
   var scrollOff=(renderTick*0.5)%12;
   for(var ty2=0;ty2<3;ty2++){
    var charY=sy+7+ty2*6+scrollOff%6;
    if(charY<sy+TS-8){
     var chars='01';
     for(var cx=0;cx<3;cx++){
      ctx.fillText(chars[Math.floor(Math.random()*2)],sx+6+cx*7,charY);
     }
    }
   }
   ctx.globalAlpha=1;
   // Pulsing glow halo
   ctx.shadowBlur=8+Math.sin(renderTick*0.04)*4;ctx.shadowColor=theme.termGlow;
   ctx.fillStyle='transparent';ctx.fillRect(sx+5,sy+5,TS-10,TS-12);
   ctx.shadowBlur=0;
   break;
  case TILE.SERVER:
   ctx.fillStyle=theme.floor;ctx.fillRect(sx,sy,TS,TS);
   // Server rack body
   ctx.fillStyle=theme.server;ctx.fillRect(sx+2,sy+1,TS-4,TS-2);
   // Rack lines
   ctx.fillStyle='rgba(0,0,0,0.3)';
   for(var si=0;si<4;si++)ctx.fillRect(sx+2,sy+2+si*7,TS-4,1);
   // Blinking LEDs - multiple colored
   var ledColors=['#00ff9c','#ff2bd6','#ffb347','#00e8ff'];
   for(var li=0;li<4;li++){
    var blink=Math.sin(renderTick*0.1+li*1.7)>0.2?1:0.2;
    ctx.fillStyle=ledColors[li];ctx.globalAlpha=blink;
    ctx.fillRect(sx+TS-8,sy+4+li*7,3,3);
    ctx.globalAlpha=1;
   }
   // Status bar
   ctx.fillStyle=theme.accent;ctx.globalAlpha=0.3;
   ctx.fillRect(sx+5,sy+4,8,2);ctx.fillRect(sx+5,sy+11,6,2);
   ctx.globalAlpha=1;
   break;
  case TILE.DOOR:
   ctx.fillStyle=theme.floor;ctx.fillRect(sx,sy,TS,TS);
   // Sliding door effect
   var doorOpen=Math.sin(renderTick*0.03)*0.15+0.15;
   ctx.fillStyle=theme.accent;ctx.globalAlpha=0.3+Math.sin(renderTick*0.04)*0.15;
   ctx.fillRect(sx+1,sy,TS/2-2-doorOpen*TS,TS);
   ctx.fillRect(sx+TS/2+1+doorOpen*TS,sy,TS/2-2-doorOpen*TS,TS);
   ctx.globalAlpha=1;
   // Bright accent glow line
   ctx.fillStyle=theme.accent;ctx.globalAlpha=0.6+Math.sin(renderTick*0.06)*0.3;
   ctx.fillRect(sx+TS/2-1,sy,2,TS);
   ctx.globalAlpha=1;
   // EXIT label
   ctx.fillStyle='#fff';ctx.font='bold 8px VT323';ctx.textAlign='center';
   ctx.fillText('EXIT',sx+TS/2,sy+TS/2+3);
   // Find door destination for label
   var def2=SECTOR_DEFS[currentSector];
   if(def2&&def2.doors){
    var dtx=Math.floor((sx+camX)/TS),dty=Math.floor((sy+camY)/TS);
    for(var di=0;di<def2.doors.length;di++){
     if(def2.doors[di].x===dtx&&def2.doors[di].y===dty){
      ctx.fillStyle=theme.accent;ctx.font='7px "Share Tech Mono"';
      ctx.globalAlpha=0.7;ctx.fillText(def2.doors[di].to,sx+TS/2,sy-3);ctx.globalAlpha=1;
      break;
     }
    }
   }
   break;
  case TILE.CHEST:
   ctx.fillStyle=theme.floor;ctx.fillRect(sx,sy,TS,TS);
   ctx.fillStyle='#ffb347';ctx.fillRect(sx+6,sy+8,TS-12,TS-14);
   ctx.fillStyle='#ffd700';ctx.fillRect(sx+12,sy+12,8,4);
   // Subtle shine
   ctx.fillStyle='rgba(255,215,0,0.15)';ctx.fillRect(sx+7,sy+9,4,2);
   break;
  case TILE.HEAL:
   ctx.fillStyle=theme.floor;ctx.fillRect(sx,sy,TS,TS);
   // Animated medical cross with pulse rings
   var pulseR=8+Math.sin(renderTick*0.08)*3;
   ctx.fillStyle='#00ff9c';
   ctx.globalAlpha=0.15;
   ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,pulseR+6,0,Math.PI*2);ctx.fill();
   ctx.globalAlpha=0.08;
   ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,pulseR+12,0,Math.PI*2);ctx.fill();
   ctx.globalAlpha=0.5+Math.sin(renderTick*0.05)*0.3;
   ctx.fillRect(sx+12,sy+4,8,24);ctx.fillRect(sx+4,sy+12,24,8);
   ctx.globalAlpha=1;
   // Glow
   ctx.shadowBlur=10;ctx.shadowColor='#00ff9c';
   ctx.fillStyle='transparent';ctx.fillRect(sx+12,sy+12,8,8);
   ctx.shadowBlur=0;
   break;
  case TILE.DANGER:
   // Red gradient base
   var dgrd=ctx.createLinearGradient(sx,sy,sx+TS,sy+TS);
   dgrd.addColorStop(0,theme.danger);
   dgrd.addColorStop(1,'#1a0505');
   ctx.fillStyle=dgrd;ctx.fillRect(sx,sy,TS,TS);
   // Pulsing red grid overlay
   ctx.strokeStyle='#ff2222';ctx.lineWidth=0.3;
   ctx.globalAlpha=0.15+Math.sin(renderTick*0.04)*0.08;
   ctx.strokeRect(sx+0.5,sy+0.5,TS-1,TS-1);
   // Warning chevrons every few tiles
   detail=getTileDetail(Math.floor((sx+camX)/TS),Math.floor((sy+camY)/TS));
   if(detail<0.12){
    ctx.globalAlpha=0.15+Math.sin(renderTick*0.06)*0.1;
    ctx.strokeStyle='#ff4444';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx+8,sy+TS/2-4);ctx.lineTo(sx+TS/2,sy+TS/2-8);ctx.lineTo(sx+TS-8,sy+TS/2-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx+8,sy+TS/2+4);ctx.lineTo(sx+TS/2,sy+TS/2);ctx.lineTo(sx+TS-8,sy+TS/2+4);ctx.stroke();
   }
   ctx.globalAlpha=1;
   // Red fog particles
   if(Math.random()<0.015){
    particles.push({x:sx+Math.random()*TS,y:sy+Math.random()*TS,
     vx:(Math.random()-0.5)*0.3,vy:-Math.random()*0.5-0.2,life:40,color:'#ff222244',size:2+Math.random()*2});
   }
   break;
  default:
   ctx.fillStyle='#020508';ctx.fillRect(sx,sy,TS,TS);
 }
}

function drawPlayer(sx,sy){
 var bx=sx+2,by=sy;
 var breathOff=pMoving?0:Math.sin(renderTick*0.06)*1.5;
 by+=breathOff;

 // Shadow
 ctx.fillStyle='rgba(0,0,0,.35)';
 ctx.beginPath();ctx.ellipse(bx+14,by+30,10,3,0,0,Math.PI*2);ctx.fill();

 // Determine facing offsets
 var faceLeft=pFacing==='left',faceRight=pFacing==='right',faceUp=pFacing==='up';

 // Walk cycle
 var legOff=0,bodyLean=0;
 if(pMoving){
  legOff=Math.sin(pAnimFrame*0.4)*3;
  bodyLean=Math.sin(pAnimFrame*0.4)*0.5;
 }

 // Tactical coat (body)
 ctx.fillStyle='#0c1a2e';
 ctx.fillRect(bx+4,by+12+bodyLean,20,14);
 // Coat highlights
 ctx.fillStyle='#0f2236';
 ctx.fillRect(bx+5,by+13+bodyLean,18,2);

 // Shoulder pauldrons with faction trim
 ctx.fillStyle='#0a1525';
 ctx.fillRect(bx+2,by+12+bodyLean,5,6);ctx.fillRect(bx+21,by+12+bodyLean,5,6);
 // Pauldron accent
 ctx.fillStyle='#00e8ff';
 ctx.fillRect(bx+2,by+12+bodyLean,5,1);ctx.fillRect(bx+21,by+12+bodyLean,5,1);

 // Coat side trim
 ctx.fillStyle='#00e8ff';ctx.globalAlpha=0.6;
 ctx.fillRect(bx+4,by+13+bodyLean,1,12);ctx.fillRect(bx+23,by+13+bodyLean,1,12);
 ctx.globalAlpha=1;

 // Legs with walk animation
 ctx.fillStyle='#1a2a3a';

 // Head

 }

function drawDaemonSprite(canv,daemon){
 var cw=canv.width,ch=canv.height;
 var c=canv.getContext('2d');c.clearRect(0,0,cw,ch);
 var tier=daemon.tier;
 var colors=['#ff2bd6','#ff006e','#ff4444','#ff0000'];
 var col=colors[Math.min(tier-1,3)];
 var cx2=cw/2,cy2=ch/2;

 // Glitch background
 c.fillStyle=col+'08';c.fillRect(0,0,cw,ch);

 // Animated glitch pulse
 var pulse=Math.sin(renderTick*0.05)*0.1+0.9;
 c.save();c.translate(cx2,cy2);c.scale(pulse,pulse);c.translate(-cx2,-cy2);

 // Body - geometric daemon shape with gradient
 var grd=c.createRadialGradient(cx2,cy2,10,cx2,cy2,cw*0.45);
 grd.addColorStop(0,col);grd.addColorStop(1,col+'44');
 c.fillStyle=grd;c.globalAlpha=0.8;
 c.beginPath();c.moveTo(cx2,8);c.lineTo(cx2+cw*0.33,cy2-10);c.lineTo(cx2+cw*0.3,ch-15);c.lineTo(cx2-cw*0.3,ch-15);c.lineTo(cx2-cw*0.33,cy2-10);c.closePath();c.fill();
 c.globalAlpha=1;

 // Inner glow core
 var coreGrd=c.createRadialGradient(cx2,cy2-5,0,cx2,cy2-5,15+tier*3);
 coreGrd.addColorStop(0,'#ffffff');coreGrd.addColorStop(0.5,col);coreGrd.addColorStop(1,'transparent');
 c.fillStyle=coreGrd;c.globalAlpha=0.9;
 c.beginPath();c.arc(cx2,cy2-5,12+tier*3,0,Math.PI*2);c.fill();
 c.globalAlpha=1;

 // Eyes
 c.fillStyle=col;c.shadowBlur=6;c.shadowColor=col;
 c.fillRect(cx2-18,cy2-15,12,7);c.fillRect(cx2+6,cy2-15,12,7);
 // Eye pupils
 c.fillStyle='#fff';
 c.fillRect(cx2-14,cy2-13,4,3);c.fillRect(cx2+10,cy2-13,4,3);
 c.shadowBlur=0;

 // Tier marks - glowing dots
 for(var i=0;i<tier;i++){
  c.fillStyle=col;c.shadowBlur=4;c.shadowColor=col;
  c.beginPath();c.arc(cx2-((tier-1)*8)+i*16,ch-20,4,0,Math.PI*2);c.fill();
 }
 c.shadowBlur=0;

 // Glitch lines (animated)
 c.fillStyle=col+'33';
 for(var j=0;j<2+tier;j++){
  var gy=((renderTick*2+j*37)%ch);
  c.fillRect(0,gy,cw,1+Math.random()*2);
 }

 c.restore();
}

function drawGlowTrail(){
 for(var i=0;i<glowTrail.length;i++){
  var t=glowTrail[i];
  var age=t.age/t.maxAge;
  ctx.fillStyle='#00e8ff';
  ctx.globalAlpha=(1-age)*0.3;
  ctx.beginPath();
  ctx.arc(t.x*TS+TS/2-camX+screenShake.x,t.y*TS+TS/2-camY+screenShake.y,2+age*2,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 }
}

function drawParticles(){
 for(var i=particles.length-1;i>=0;i--){
  var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
  if(p.life<=0){particles.splice(i,1);continue;}
  ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/20);
  var s=p.size||2;
  ctx.fillRect(p.x-camX+screenShake.x,p.y-camY+screenShake.y,s,s);ctx.globalAlpha=1;
 }
}

function drawAmbientParticles(){
 var theme=SECTOR_THEMES[currentSector];
 for(var i=0;i<ambientParticles.length;i++){
  var p=ambientParticles[i];
  p.x+=p.vx;p.y+=p.vy;p.life--;
  if(p.life<=0){
   p.x=camX+Math.random()*W;p.y=camY+H+10;
   p.life=200+Math.random()*200;p.maxLife=p.life;
  }
  var screenX=p.x-camX+screenShake.x;
  var screenY=p.y-camY+screenShake.y;
  if(screenX<-10||screenX>W+10||screenY<-10||screenY>H+10)continue;
  ctx.fillStyle=theme.accent;
  ctx.globalAlpha=0.15*(p.life/p.maxLife);
  ctx.beginPath();
  ctx.arc(screenX,screenY,p.size,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 }
}

function drawVignette(){
 var theme=SECTOR_THEMES[currentSector];
 var rgb=hexToRgb(theme.accent);
 // Edge vignette
 var grd=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.8);
 grd.addColorStop(0,'transparent');
 grd.addColorStop(1,'rgba('+Math.floor(rgb.r*0.1)+','+Math.floor(rgb.g*0.1)+','+Math.floor(rgb.b*0.1)+',0.3)');
 ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}

function drawGlitchEffect(){
 if(!glitchActive)return;
 // Horizontal slice displacement
 var sliceH=4+Math.random()*10;
 var sliceY=glitchSlice;
 var disp=(Math.random()-0.5)*12;
 try{
  var imgData=ctx.getImageData(0,Math.max(0,sliceY),W,Math.min(sliceH,H-sliceY));
  ctx.putImageData(imgData,disp,sliceY);
 }catch(e){}
}

function renderWorld(){
 ctx.fillStyle='#02070d';ctx.fillRect(0,0,W,H);
 if(!currentMap)return;
 var theme=SECTOR_THEMES[currentSector]||SECTOR_THEMES['Mainframe Core'];

 ctx.save();
 ctx.translate(screenShake.x,screenShake.y);

 var startX=Math.max(0,Math.floor(camX/TS));
 var startY=Math.max(0,Math.floor(camY/TS));
 var endX=Math.min(mapW,Math.ceil((camX+W)/TS)+1);
 var endY=Math.min(mapH,Math.ceil((camY+H)/TS)+1);
 for(var y=startY;y<endY;y++){
  for(var x=startX;x<endX;x++){
   drawTile(currentMap[y][x],x*TS-camX,y*TS-camY,theme);
  }
 }

 // Glow trail behind player
 drawGlowTrail();

 // Entities
 entities.forEach(function(e){
  var sx=e.x*TS-camX,sy=e.y*TS-camY;
  if(sx<-TS*2||sx>W+TS*2||sy<-TS*2||sy>H+TS*2)return;
  if(e.type==='npc')drawNPC(e,sx,sy);
  else if(e.type==='terminal')drawModuleTerminal(e,sx,sy);
 });

 // Player
 drawPlayer(px*TS-camX,py*TS-camY);

 ctx.restore();

 // Particles (in screen space already handle shake)
 drawParticles();
 drawAmbientParticles();

 // Vignette overlay
 drawVignette();

 // Glitch effect
 drawGlitchEffect();
}

function updateHUD(){
 document.getElementById('hud-sector').textContent=currentSector.toUpperCase();
 document.getElementById('hud-level').textContent='TIER '+state.level+' — '+state.callsign;
 document.getElementById('hud-credits').textContent='¢ '+state.credits;
 document.getElementById('hp-val').textContent=state.hp+'/'+state.maxHp;
 document.getElementById('hp-fill').style.width=Math.round(state.hp/state.maxHp*100)+'%';
 document.getElementById('sh-val').textContent=state.shield+'/'+state.maxShield;
 document.getElementById('sh-fill').style.width=Math.round(state.shield/state.maxShield*100)+'%';
 var xpNeed=xpForLevel(state.level);
 document.getElementById('xp-val').textContent=state.xp+'/'+xpNeed;
 document.getElementById('xp-fill').style.width=Math.round(state.xp/xpNeed*100)+'%';
 // Ambient noise/threat based on sector danger level
 var threatLevel='LOW';var threatPct=10;
 if(currentSector==='LAN Valley'){threatLevel='MODERATE';threatPct=30;}
 else if(currentSector==='Darknet Depths'){threatLevel='HIGH';threatPct=55;}
 else if(currentSector==='Stormcore'){threatLevel='CRITICAL';threatPct=80;}
 document.getElementById('noise-val').textContent=threatLevel;
 document.getElementById('noise-fill').style.width=threatPct+'%';
}
function xpForLevel(L){return Math.floor(100*Math.pow(1.35,L-1));}

function toast(msg,color){
 var el=document.createElement('div');el.className='toast';el.textContent=msg;
 if(color)el.style.borderColor=color,el.style.color=color;
 document.getElementById('toast-area').appendChild(el);
 setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},2800);
}

// ═══════════════════════════════════════════════════════
// XP / LEVELING
// ═══════════════════════════════════════════════════════
function gainXp(n){
 state.xp+=n;
 while(state.level<10&&state.xp>=xpForLevel(state.level)){
  state.xp-=xpForLevel(state.level);state.level++;
  state.maxHp+=12;state.hp=state.maxHp;state.maxShield+=6;state.shield=state.maxShield;
  toast('LEVEL UP — TIER '+state.level);sfx.levelUp();
 }
 if(state.level>=10)state.xp=Math.min(state.xp,xpForLevel(10));
 saveState();updateHUD();
}
function gainCredits(n){state.credits+=n;saveState();updateHUD();}
function gainItem(id,qty){state.inventory[id]=(state.inventory[id]||0)+(qty||1);saveState();toast('ACQUIRED: '+id,'#ffb347');}
function gainRep(changes){
 if(!changes)return;for(var f in changes){
  state.reputation[f]=(state.reputation[f]||0)+changes[f];
  state.reputation[f]=Math.max(-100,Math.min(100,state.reputation[f]));
 }state.factions=state.reputation;saveState();
}
function gainSkill(domain,amt){
 if(!domain||state.skills[domain]==null)return;
 state.skills[domain]=Math.min(100,(state.skills[domain]||0)+amt);saveState();
}
function addCodex(entry){
 if(state.codex.some(function(e){return e.id===entry.id;}))return;
 state.codex.push(entry);saveState();toast('CODEX ENTRY: '+entry.id,'#00e8ff');
}

// ═══════════════════════════════════════════════════════
// MOVEMENT & INTERACTION
// ═══════════════════════════════════════════════════════
var moveCD=0;
function canWalk(tx,ty){
 if(tx<0||tx>=mapW||ty<0||ty>=mapH)return false;
 var t=currentMap[ty][tx];
 if(t===TILE.WALL||t===TILE.VOID||t===TILE.SERVER)return false;
 var blocked=entities.some(function(e){return e.x===tx&&e.y===ty;});
 return!blocked;
}

function tryMove(dx,dy){
 if(moveCD>0)return;
 var nx=px+dx,ny=py+dy;
 if(dx<0)pFacing='left';else if(dx>0)pFacing='right';
 else if(dy<0)pFacing='up';else pFacing='down';
 if(!canWalk(nx,ny))return;
 // Update glow trail
 glowTrail.push({x:px,y:py,age:0,maxAge:30});
 if(glowTrail.length>5)glowTrail.shift();

 px=nx;py=ny;pMoving=true;pAnimFrame++;moveCD=6;
 state.playerX=px;state.playerY=py;
 sfx.step();
 var tile=currentMap[ny][nx];
 if(tile===TILE.DOOR)checkDoor(nx,ny);
 else if(tile===TILE.HEAL)healStation();
 else if(tile===TILE.CHEST)openChest(nx,ny);
 else if(tile===TILE.DANGER){
  checkEncounter();
  // Subtle rumble on danger tiles
  if(screenShake.intensity<1)triggerShake(1.5);
 }
}

function checkDoor(dx,dy){
 var def=SECTOR_DEFS[currentSector];if(!def||!def.doors)return;
 def.doors.forEach(function(d){
  if(d.x===dx&&d.y===dy){
   if(d.reqLevel&&state.level<d.reqLevel){
    toast('REQUIRES TIER '+d.reqLevel+' — LOCKED','#ff4444');sfx.error();return;
   }
   sfx.door();transitionTo(d.to,d.sx,d.sy);
  }
 });
}

function healStation(){
 if(state.hp>=state.maxHp&&state.shield>=state.maxShield)return;
 state.hp=state.maxHp;state.shield=state.maxShield;
 saveState();updateHUD();toast('SYSTEMS RESTORED','#00ff9c');sfx.heal();
}

function openChest(cx,cy){
 currentMap[cy][cx]=TILE.FLOOR;
 var roll=Math.random();
 if(roll<.4){gainItem('PATCH-KIT');gainCredits(20);}
 else if(roll<.7){gainCredits(50);toast('+50 CREDITS','#ffb347');}
 else{gainItem('FIREWALL-RULE');gainCredits(30);}
 sfx.click();
}

// BUG FIX #5: Random encounters — ~8% chance, 60 tick cooldown (was 18% / 40 ticks)
var encounterCD=0;
function checkEncounter(){
 if(encounterCD>0)return;
 if(Math.random()>0.08)return;  // ~8% chance (was 18%)
 var def=SECTOR_DEFS[currentSector];if(!def||!def.daemons||!def.daemons.length)return;
 var did=def.daemons[Math.floor(Math.random()*def.daemons.length)];
 var daemon=DAEMON_MAP[did];if(!daemon)return;
 encounterCD=60;  // 60 tick cooldown (was 40)
 sfx.encounter();startCombat(daemon);
}

function interact(){
 var dirs=[[0,-1],[0,1],[-1,0],[1,0],[0,0]];
 for(var i=0;i<dirs.length;i++){
  var tx=px+dirs[i][0],ty=py+dirs[i][1];
  for(var j=0;j<entities.length;j++){
   var ent=entities[j];
   if(ent.x===tx&&ent.y===ty){
    if(ent.type==='npc'){startDialogue(ent);return;}
    if(ent.type==='terminal'&&ent.url){
     sfx.door();toast('LAUNCHING: '+ent.name,ent.color);
     saveState();
     setTimeout(function(){window.open(ent.url,'_blank');},200);
     return;
    }
   }
  }
 }
 var tile=currentMap[py][px];
 if(tile===TILE.TERMINAL){
  toast('TERMINAL ACCESSED','#00e8ff');sfx.click();
  checkMissionTerminal();
 }else if(tile===TILE.SERVER){
  for(var d=0;d<dirs.length;d++){
   var sx2=px+dirs[d][0],sy2=py+dirs[d][1];
   for(var e=0;e<entities.length;e++){
    if(entities[e].type==='terminal'&&entities[e].x===sx2&&entities[e].y===sy2&&entities[e].url){
     sfx.door();toast('LAUNCHING: '+entities[e].name,entities[e].color);
     saveState();
     setTimeout(function(){var u=entities[e].url;window.open(u,'_blank');},200);
     return;
    }
   }
  }
 }
}

function checkMissionTerminal(){
 MISSIONS.forEach(function(m){
  if(m.sector!==currentSector)return;
  if(state.completedMissions[m.id])return;
  if(m.kind!=='instant')return;
  if(m.level>state.level)return;
  completeMission(m);
 });
}

function startDialogue(npc){
 var data=NPC_DATA[npc.id];if(!data)return;
 gameMode=MODE.DIALOGUE;sfx.click();
 var lines=[];
 var questMission=null;
 if(data.quest){
  var qm=MISSION_MAP[data.quest];
  if(qm&&!state.completedMissions[qm.id]&&state.level>=qm.level){
   questMission=qm;
   lines.push(data.questLine||('I have a mission for you: '+qm.title));
  }
 }
 if(!lines.length){
  lines=data.lines.slice();
  if(npc.id==='shadow'){
   var ddp=MISSION_MAP['dd-phantom'];
   if(ddp&&!state.completedMissions['dd-phantom']&&state.level>=ddp.level){
    questMission=ddp;lines.push('I have something for you. A dead drop with intel about Project AXIOM.');
   }
  }
  if(npc.id==='cipher'){
   var ddb=MISSION_MAP['dd-double'];
   if(ddb&&!state.completedMissions['dd-double']&&state.level>=ddb.level&&state.completedMissions['dd-phantom']){
    questMission=ddb;lines.push('Both sides want your answer. Report to GRIDWATCH, or protect us. Choose.');
   }
  }
 }
 dlg={npc:npc,data:data,lines:lines,idx:0,quest:questMission,choiceMode:false};
 drawNPCPortrait(data);
 // Set quest border styling
 var inner=document.querySelector('.dlg-inner');
 if(questMission)inner.classList.add('quest-border');
 else inner.classList.remove('quest-border');
 // Set name tag color
 var nameEl=document.getElementById('dlg-name');
 nameEl.style.background=data.color?data.color+'22':'#6fdfff22';
 nameEl.style.color=data.color||'#6fdfff';
 showDialogueLine();
}

function showDialogueLine(){
 if(!dlg)return;
 var box=document.getElementById('dialogue-box');box.classList.add('active');
 document.getElementById('dlg-name').textContent=dlg.data.name;
 document.getElementById('dlg-choices').innerHTML='';
 document.getElementById('dlg-hint').style.display='block';
 if(dlg.idx<dlg.lines.length){
  // Typewriter effect
  typewriterTarget=dlg.lines[dlg.idx];
  typewriterText='';typewriterIdx=0;typewriterTimer=0;
  document.getElementById('dlg-text').textContent='';
 // BUG FIX #3: >= instead of > for quest check on final advance
 }else if(dlg.quest&&!dlg.choiceMode){
  if(dlg.quest.kind==='choice'&&dlg.quest.choices){
   dlg.choiceMode=true;
   typewriterTarget='Make your choice:';typewriterText='';typewriterIdx=0;typewriterTimer=0;
   document.getElementById('dlg-text').textContent='';
   document.getElementById('dlg-hint').style.display='none';
   var cDiv=document.getElementById('dlg-choices');
   dlg.quest.choices.forEach(function(ch){
    var btn=document.createElement('button');btn.className='dlg-choice';btn.textContent=ch.label;
    btn.onclick=function(){
     if(ch.rep)gainRep(ch.rep);
     completeMission(dlg.quest);
     closeDialogue();
    };
    cDiv.appendChild(btn);
   });
   return;
  }else if(dlg.quest.kind==='combat'){
   // BUG FIX #2: Auto-trigger combat, don't require extra SPACE press
   var m=dlg.quest;
   closeDialogue();
   var daemon=DAEMON_MAP[m.enemy];
   if(daemon)startCombat(daemon,m);
   return;
  }else{
   completeMission(dlg.quest);
   typewriterTarget='Mission complete: '+dlg.quest.title;
   typewriterText='';typewriterIdx=0;typewriterTimer=0;
   document.getElementById('dlg-text').textContent='';
   dlg.quest=null; // prevent re-triggering
  }
 }else{
  closeDialogue();return;
 }
}

function advanceDialogue(){
 if(!dlg)return;
 sfx.click();
 if(dlg.choiceMode)return;
 // If typewriter is still going, complete it instantly
 if(typewriterIdx<typewriterTarget.length){
  typewriterText=typewriterTarget;typewriterIdx=typewriterTarget.length;
  document.getElementById('dlg-text').textContent=typewriterText;
  return;
 }
 dlg.idx++;
 // BUG FIX #3: >= instead of >
 if(dlg.idx>=dlg.lines.length&&!dlg.quest){
  closeDialogue();return;
 }
 showDialogueLine();
}

function updateTypewriter(){
 if(!dlg||typewriterIdx>=typewriterTarget.length)return;
 typewriterTimer++;
 if(typewriterTimer%2===0){
  typewriterText+=typewriterTarget[typewriterIdx];
  typewriterIdx++;
  document.getElementById('dlg-text').textContent=typewriterText+(typewriterIdx<typewriterTarget.length?'█':'');
 }
}

function closeDialogue(){
 dlg=null;gameMode=MODE.EXPLORE;
 typewriterTarget='';typewriterText='';typewriterIdx=0;
 document.getElementById('dialogue-box').classList.remove('active');
 document.querySelector('.dlg-inner').classList.remove('quest-border');
}

// COMBAT — with animations, floating damage, screen flash

var combat=null;
var combatBgAnim=0;
var floatingDamages=[];

function scaleDaemon(d){
 var tm=1+(d.tier-1)*.25;var lm=1+Math.max(0,(state.level-1)*.06);
 var hp=Math.round(d.baseHp*tm*lm);var atk=Math.round(d.atk*tm);var def=Math.round(d.def*tm);
 if(d.id==='STORMCORE_SENTINEL'){hp=Math.round(hp*1.5);atk=Math.round(atk*1.3);}
 return{id:d.id,name:d.name,attackClass:d.attackClass,tier:d.tier,hp:hp,maxHp:hp,atk:atk,def:def,
  behavior:d.behavior,skill:d.skill,counter:d.counter,weaknessRevealed:false};
}

function drawCombatBg(){
 var cbg=document.getElementById('combat-bg');
 if(cbg.width!==W||cbg.height!==H){cbg.width=W;cbg.height=H;}
 var c=cbg.getContext('2d');
 var theme=SECTOR_THEMES[currentSector];
 var rgb=hexToRgb(theme.accent);

 // Dark center, sector-colored edges
 var grd=c.createRadialGradient(W/2,H/2,50,W/2,H/2,W*0.7);
 grd.addColorStop(0,'#02070d');
 grd.addColorStop(1,'rgba('+Math.floor(rgb.r*0.3)+','+Math.floor(rgb.g*0.3)+','+Math.floor(rgb.b*0.3)+',0.4)');
 c.fillStyle=grd;c.fillRect(0,0,W,H);

 // Grid lines
 c.strokeStyle='rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.04)';c.lineWidth=0.5;
 for(var gy=0;gy<H;gy+=40){c.beginPath();c.moveTo(0,gy);c.lineTo(W,gy);c.stroke();}
 for(var gx=0;gx<W;gx+=40){c.beginPath();c.moveTo(gx,0);c.lineTo(gx,H);c.stroke();}
}

function flashCombatScreen(color){
 var fl=document.getElementById('combat-flash');
 fl.style.background=color||'rgba(255,255,255,0.15)';
 fl.style.opacity='1';
 setTimeout(function(){fl.style.opacity='0';},100);
}

function spawnFloatingDmg(val,color,isEnemy){
 var area=document.getElementById('cb-sprite-area');
 var rect=area.getBoundingClientRect();
 var el=document.createElement('div');
 el.className='cb-float-dmg';
 el.textContent=(val>0?'-':'')+Math.abs(val);
 el.style.color=color||'#ff2bd6';
 el.style.left=(rect.left+rect.width/2-20)+'px';
 el.style.top=(rect.top+30)+'px';
 document.body.appendChild(el);
 setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1000);
}

function startCombat(daemon,mission){
 var sd=scaleDaemon(daemon);
 combat={enemy:sd,turn:'player',noise:0,log:[],mission:mission||null,recon:false};
 gameMode=MODE.COMBAT;
 document.getElementById('combat-overlay').classList.add('active');
 document.getElementById('cb-ename').textContent=sd.name;
 document.getElementById('cb-eclass').textContent=sd.attackClass+' — TIER '+sd.tier;
 document.getElementById('cb-pname').textContent=state.callsign;
 drawCombatBg();
 drawDaemonSprite(document.getElementById('cb-esprite'),daemon);
 combatLog('ENCOUNTER: '+sd.name,'info');
 if(mission)combatLog('MISSION: '+mission.title,'info');
 updateCombatUI();
}

function combatLog(msg,cls){
 if(!combat)return;combat.log.push({msg:msg,cls:cls||''});
 var el=document.getElementById('cb-log');
 el.innerHTML=combat.log.map(function(l){return'<div class="'+l.cls+'">'+l.msg+'</div>';}).join('');
 el.scrollTop=el.scrollHeight;
}

function updateCombatUI(){
 if(!combat)return;var e=combat.enemy;
 document.getElementById('cb-ehp-val').textContent=e.hp+'/'+e.maxHp;
 document.getElementById('cb-ehp-fill').style.width=Math.round(e.hp/e.maxHp*100)+'%';
 document.getElementById('cb-php-val').textContent=state.hp+'/'+state.maxHp;
 document.getElementById('cb-php-fill').style.width=Math.round(state.hp/state.maxHp*100)+'%';
 document.getElementById('cb-psh-val').textContent=state.shield+'/'+state.maxShield;
 document.getElementById('cb-psh-fill').style.width=Math.round(state.shield/state.maxShield*100)+'%';
 document.getElementById('cb-noise-val').textContent=combat.noise+'/100';
 document.getElementById('cb-noise-fill').style.width=combat.noise+'%';

 // BUG FIX #1: Properly disable/enable buttons based on turn
 var btns=document.querySelectorAll('.cb-btn');
 btns.forEach(function(b){b.disabled=combat.turn!=='player';});

 // Turn indicator
 var turnEl=document.getElementById('cb-turn');
 if(combat.turn==='player'){
  turnEl.textContent='YOUR TURN';turnEl.className='cb-turn-indicator player-turn';
 }else{
  turnEl.textContent='ENEMY TURN';turnEl.className='cb-turn-indicator enemy-turn';
 }
}

function combatAction(verb){
 if(!combat||combat.turn!=='player')return;
 var e=combat.enemy;sfx.click();

 // BUG FIX #1: Immediately disable buttons and set turn
 combat.turn='enemy';
 updateCombatUI();

 if(verb==='recon'){
  combat.noise=Math.min(100,combat.noise+5);combat.recon=true;e.weaknessRevealed=true;
  gainSkill(e.skill,2);
  combatLog('RECON: Weakness scanned — '+e.skill.toUpperCase()+' domain [noise +5]','info');
 }else if(verb==='exploit'){
  var baseAtk=8+Math.floor(state.level*1.5);
  var bonus=0;
  if(combat.recon&&e.skill&&state.skills[e.skill])bonus=Math.floor(state.skills[e.skill]*.15);
  var dmg=Math.max(1,baseAtk-e.def+bonus);
  e.hp=Math.max(0,e.hp-dmg);
  var noiseAdd=15+Math.floor(Math.random()*11);
  combat.noise=Math.min(100,combat.noise+noiseAdd);
  combatLog('EXPLOIT: '+dmg+' dmg'+(bonus>0?' (weakness +'+bonus+')':'')+' [noise +'+noiseAdd+']','hit');
  sfx.hit();gainSkill(e.skill,3);
  flashCombatScreen('rgba(255,43,214,0.12)');
  spawnFloatingDmg(dmg,'#ff2bd6',true);
  // Flash enemy HP bar
  var ehpFill=document.getElementById('cb-ehp-fill');
  ehpFill.classList.remove('flash');void ehpFill.offsetWidth;ehpFill.classList.add('flash');
 }else if(verb==='patch'){
  if(state.inventory['PATCH-KIT']&&state.inventory['PATCH-KIT']>0){
   state.inventory['PATCH-KIT']--;
   var heal=Math.min(40,state.maxHp-state.hp);state.hp+=heal;
   combat.noise=Math.min(100,combat.noise+8);
   combatLog('PATCH: +'+heal+' HP [noise +8]','heal');sfx.heal();
  }else{
   var smallHeal=Math.min(15,state.maxHp-state.hp);state.hp+=smallHeal;
   combat.noise=Math.min(100,combat.noise+8);
   combatLog('PATCH (no kit): +'+smallHeal+' HP [noise +8]','heal');
  }
  saveState();
 }else if(verb==='run'){
  var chance=.4+(state.level-e.tier)*.1;
  if(Math.random()<chance){
   combatLog('RUN: Escaped successfully!','info');
   endCombat(false);return;
  }else{
   combatLog('RUN: Failed to escape!','warn');
  }
 }

 // Check noise threshold
 if(combat&&combat.noise>=100){
  var socDmg=8+Math.floor(state.level*1.2);
  var absorbed=Math.min(state.shield,Math.floor(socDmg/2));
  state.shield-=absorbed;state.hp-=socDmg-absorbed;
  combatLog('SOC SENTINEL DETECTS INTRUSION! Strikes for '+(socDmg-absorbed)+' ('+absorbed+' absorbed)','warn');
  combat.noise=Math.max(0,combat.noise-30);sfx.playerHit();
  triggerShake(6);flashCombatScreen('rgba(255,68,68,0.2)');
 }

 // Check enemy death
 if(combat&&e.hp<=0){
  combatLog(e.name+' NEUTRALIZED','heal');
  sfx.win();endCombat(true);return;
 }

 // Check player death
 if(combat&&state.hp<=0){
  combatLog('OPERATIVE DOWN','warn');
  endCombat(false,true);return;
 }

 updateCombatUI();

 // Enemy turn after delay
 setTimeout(function(){
  if(!combat)return;
  enemyTurn();
 },600);
}

function enemyTurn(){
 if(!combat)return;
 var e=combat.enemy;
 var eatk=e.atk+Math.floor(Math.random()*4);
 var absorbed=Math.min(state.shield,Math.floor(eatk/2));
 state.shield=Math.max(0,state.shield-absorbed);
 var dmg=eatk-absorbed;state.hp=Math.max(0,state.hp-dmg);
 combatLog(e.name+' attacks: '+dmg+' dmg ('+absorbed+' absorbed)','hit');
 sfx.playerHit();

 // Screen shake on player hit
 triggerShake(4);
 flashCombatScreen('rgba(255,255,255,0.1)');
 spawnFloatingDmg(dmg,'#ff4444',false);
 // Flash player HP bar
 var phpFill=document.getElementById('cb-php-fill');
 phpFill.classList.remove('flash');void phpFill.offsetWidth;phpFill.classList.add('flash');

 if(state.hp<=0){
  combatLog('OPERATIVE DOWN','warn');
  endCombat(false,true);return;
 }

 combat.turn='player';updateCombatUI();saveState();updateHUD();
}

function endCombat(won,died){
 if(!combat)return;
 var enemy=combat.enemy;var mission=combat.mission;

 if(won){
  state.daemonsKilled=(state.daemonsKilled||0)+1;
  if(enemy.id==='STORMCORE_SENTINEL')state.sentinelBeaten=true;
  addCodex({id:enemy.id,name:enemy.name,type:'daemon',attackClass:enemy.attackClass,tier:enemy.tier});
  gainSkill(enemy.skill,5+enemy.tier*2);
  if(mission){
   completeMission(mission);
  }else{
   gainXp(10+enemy.tier*8);gainCredits(15+enemy.tier*10);
  }
  // BUG FIX #4: Don't set gameMode to EXPLORE when won — let showCounterCard handle it
  combat=null;saveState();updateHUD();
  document.getElementById('combat-overlay').classList.remove('active');
  setTimeout(function(){showCounterCard(enemy);},400);
  return; // Exit early, don't set gameMode to EXPLORE
 }else if(died){
  state.hp=Math.floor(state.maxHp*.3);state.shield=0;
  toast('RESPAWNED — systems critical','#ff4444');
 }

 combat=null;saveState();updateHUD();
 document.getElementById('combat-overlay').classList.remove('active');
 gameMode=MODE.EXPLORE;
}

function showCounterCard(enemy){
 gameMode=MODE.DIALOGUE; // BUG FIX #4: This is the only place that sets mode after combat win
 var el=document.getElementById('counter-card');el.classList.add('active');
 var c=enemy.counter;
 document.getElementById('cc-inner').innerHTML=
  '<h2>THREAT INTEL CARD</h2><h3>'+enemy.name+' — '+enemy.attackClass+'</h3>'+
  '<div class="cc-section"><div class="cc-label">REAL-WORLD ATTACK</div><div class="cc-text">'+c.desc+'</div></div>'+
  '<div class="cc-section"><div class="cc-label">DEFENSIVE COUNTERMEASURE</div><div class="cc-text">'+c.fix+'</div></div>'+
  '<button onclick="window.__cwCloseCC()">ACKNOWLEDGED</button>';
}
window.__cwCloseCC=function(){
 document.getElementById('counter-card').classList.remove('active');
 gameMode=MODE.EXPLORE;
};

// MISSION COMPLETION
// ═══════════════════════════════════════════════════════
function completeMission(m){
 if(state.completedMissions[m.id])return;
 state.completedMissions[m.id]=true;
 state.missions=Object.keys(state.completedMissions).length;
 if(m.reward){
  if(m.reward.xp)gainXp(m.reward.xp);
  if(m.reward.credits)gainCredits(m.reward.credits);
  if(m.reward.item)gainItem(m.reward.item);
  if(m.reward.rep)gainRep(m.reward.rep);
 }
 toast('MISSION COMPLETE: '+m.title,'#00ff9c');
 if(m.story){
  setTimeout(function(){
   gameMode=MODE.DIALOGUE;
   dlg={npc:null,data:{name:'[GRID NARRATIVE]',color:'#00e8ff'},lines:[m.story],idx:0,quest:null};
   drawNPCPortrait({color:'#00e8ff'});
   var nameEl=document.getElementById('dlg-name');
   nameEl.style.background='#00e8ff22';nameEl.style.color='#00e8ff';
   showDialogueLine();
  },800);
 }
 var completed=Object.keys(state.completedMissions);
 if(completed.some(function(id){return id.indexOf('sc-')===0;}))state.storyAct=3;
 else if(completed.some(function(id){return id.indexOf('dd-')===0||id.indexOf('lv-')===0;}))state.storyAct=2;
 saveState();updateHUD();
}

  html+='<b style="color:#00e8ff">STORY ACT:</b> '+(state.storyAct===1?'I — INITIALIZATION':state.storyAct===2?'II — ESCALATION':'III — CONVERGENCE')+'<br>';
  html+='<b style="color:#00e8ff">DAEMONS NEUTRALIZED:</b> '+(state.daemonsKilled||0)+'<br>';
  html+='<b style="color:#00e8ff">MISSIONS COMPLETE:</b> '+Object.keys(state.completedMissions).length+'/'+MISSIONS.length;
  html+='</div>';
 }else if(menuTab==='codex'){
  html='<h3>CODEX ('+state.codex.length+' ENTRIES)</h3>';
  if(!state.codex.length)html+='<div style="color:#888">Defeat daemons to unlock threat intel entries.</div>';
  state.codex.forEach(function(e){
   var d=DAEMON_MAP[e.id];
   // Small daemon icon preview
   html+='<div style="padding:8px;margin:6px 0;background:#06101a;border:1px solid #00e8ff22;border-radius:4px;display:flex;gap:10px;align-items:flex-start">';
   html+='<div style="width:32px;height:32px;background:#0a0a12;border:1px solid '+(d?'#ff2bd6':'#00e8ff')+'44;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#ff2bd6;font-size:16px">☠</div>';
   html+='<div style="flex:1"><div style="color:#ff2bd6;font-size:13px">'+e.name+'</div><div style="color:#a8c8d8;font-size:10px;margin-top:2px">'+e.attackClass+' — TIER '+e.tier+'</div>';
   if(d&&d.counter)html+='<div style="color:#888;font-size:10px;margin-top:4px">'+d.counter.desc+'</div><div style="color:#00ff9c;font-size:10px;margin-top:2px"><b>FIX:</b> '+d.counter.fix+'</div>';
   html+='</div></div>';
  });
 }
 el.innerHTML=html;
}

document.getElementById('menu-close').onclick=closeMenu;

// ═══════════════════════════════════════════════════════
// COMBAT BUTTON WIRING
// ═══════════════════════════════════════════════════════
document.getElementById('cb-actions').addEventListener('click',function(e){
 var btn=e.target.closest('.cb-btn');if(!btn)return;
 var verb=btn.dataset.verb;if(verb)combatAction(verb);
});

// ═══════════════════════════════════════════════════════
// NPC PATROL AI
// ═══════════════════════════════════════════════════════
function updateEntities(){
 entities.forEach(function(e){
  if(e.type!=='npc')return;
  e.patrolTimer++;
  e.idleTimer++;
  if(e.patrolTimer>80+Math.floor(Math.random()*40)){
   e.patrolTimer=0;
   var dirs=[[0,1],[0,-1],[1,0],[-1,0],[0,0],[0,0]];
   var d=dirs[Math.floor(Math.random()*dirs.length)];
   var nx=e.x+d[0],ny=e.y+d[1];
   var dist=Math.abs(nx-e.ox)+Math.abs(ny-e.oy);
   if(dist<=3&&canWalk(nx,ny)&&!(nx===px&&ny===py)){e.x=nx;e.y=ny;}
  }
 });
}

// ═══════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════
var lastTime=0;
function gameLoop(ts){
 var dt=ts-lastTime;lastTime=ts;
 renderTick++;
 if(moveCD>0)moveCD--;
 if(encounterCD>0)encounterCD--;

 // Update glow trail ages
 for(var gi=glowTrail.length-1;gi>=0;gi--){
  glowTrail[gi].age++;
  if(glowTrail[gi].age>=glowTrail[gi].maxAge)glowTrail.splice(gi,1);
 }

 // Update screen shake
 updateShake();

 // Glitch effect timer (~10 seconds)
 glitchTimer++;
 if(glitchTimer>600&&!glitchActive){
  glitchActive=true;glitchSlice=Math.random()*H;
  setTimeout(function(){glitchActive=false;glitchTimer=0;},80);
 }

 if(gameMode===MODE.EXPLORE){
  var dx=0,dy=0;
  if(keys['ArrowUp']||keys['w']||keys['W']||mobileDir==='up')dy=-1;
  else if(keys['ArrowDown']||keys['s']||keys['S']||mobileDir==='down')dy=1;
  else if(keys['ArrowLeft']||keys['a']||keys['A']||mobileDir==='left')dx=-1;
  else if(keys['ArrowRight']||keys['d']||keys['D']||mobileDir==='right')dx=1;
  else pMoving=false;
  if(dx||dy)tryMove(dx,dy);

  if(justPressed[' ']||justPressed['Enter']||mobileInteract){interact();mobileInteract=false;}
  if(justPressed['m']||justPressed['M'])openMenu('quests');
  if(justPressed['i']||justPressed['I'])openMenu('inventory');
  if(justPressed['Tab']){openMenu('map');}

  updateEntities();
 }else if(gameMode===MODE.DIALOGUE){
  if(justPressed[' ']||justPressed['Enter'])advanceDialogue();
  updateTypewriter();
 }else if(gameMode===MODE.MENU){
  if(justPressed['Escape']||justPressed['m']||justPressed['M'])closeMenu();
 }

 // Update combat daemon sprite animation
 if(gameMode===MODE.COMBAT&&combat){
  combatBgAnim++;
  if(combatBgAnim%10===0){
   var csd=combat.enemy;var origDaemon=DAEMON_MAP[csd.id];
   if(origDaemon)drawDaemonSprite(document.getElementById('cb-esprite'),origDaemon);
  }
 }

 if(justPressed['Tab']){/* already handled */}

 updateCamera();
 if(gameMode===MODE.EXPLORE||gameMode===MODE.DIALOGUE||gameMode===MODE.TRANSITION){
  renderWorld();
 }
 drawMinimap();

 justPressed={};
 requestAnimationFrame(gameLoop);
}

// Prevent default for game keys
document.addEventListener('keydown',function(e){
 if(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)!==-1){
  if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault();
 }
});

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
function boot(){
 loadSector(currentSector,state.playerX||undefined,state.playerY||undefined);
 updateHUD();
 toast('CYBERWORLD ONLINE — WASD to move, SPACE to interact, M for console');
 requestAnimationFrame(gameLoop);
 document.addEventListener('click',function(){
  var ctx2=getAudio();if(ctx2&&ctx2.state==='suspended')ctx2.resume();
 },{once:true});
 document.addEventListener('keydown',function(){
  var ctx2=getAudio();if(ctx2&&ctx2.state==='suspended')ctx2.resume();
 },{once:true});
}

if(document.readyState==='complete')boot();
else window.addEventListener('load',boot);

})();
</script>
