<!doctype html>
<!--
  CyberWorld :: Training Recovery v2.0
  Issues a deterministic, client-side "recovery ticket". No mail, no SMS,
  no backend. The ticket is a SHA-256-derived reference number bound to
  the asset fingerprint; it is meaningless outside this tab.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
  <meta name="robots" content="noindex,nofollow">
  <meta name="cyberworld:role" content="training-ctf-recovery">
  <title>CyberWorld :: Training Recovery</title>
  <style>
    :root {
      --cyan: #00ffe7;
      --pink: #ff0055;
      --ink: #060a12;
      --panel: rgba(9, 13, 25, 0.94);
      --text: #edf8fb;
      --muted: #8ba8b7;
      --warn: #ffbf00;
      --ok: #20d978;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 29%, rgba(0, 255, 231, 0.18), rgba(0, 255, 231, 0.035) 28%, transparent 56%),
        linear-gradient(135deg, #0a171d 0%, #101528 51%, #244f60 100%);
      font-family: "Courier New", Consolas, ui-monospace, monospace;
      overflow: auto;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        linear-gradient(rgba(0, 255, 231, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 231, 0.055) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.2), transparent);
      background-size: 100% 4px;
      opacity: 0.32;
      pointer-events: none;
    }

    .shell {
      position: relative; z-index: 1;
      width: min(460px, calc(100vw - 32px));
      padding: 22px 0;
    }

    .training-banner {
      margin: 0 0 14px;
      padding: 8px 12px;
      border: 1px dashed var(--warn);
      border-radius: 5px;
      background: rgba(255, 191, 0, 0.05);
      color: var(--warn);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }
    .training-banner a { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted var(--cyan); }

    .panel {
      padding: 32px 30px 28px;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(13, 18, 34, 0.98), rgba(8, 11, 22, 0.96)),
        var(--panel);
      box-shadow:
        0 0 34px rgba(0, 255, 231, 0.23),
        0 0 90px rgba(0, 255, 231, 0.1),
        inset 0 0 24px rgba(0, 255, 231, 0.04);
    }

    .brand-mark {
      display: block;
      width: 76px; height: 76px;
      margin: 0 auto 16px;
      filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.9));
    }

    h1 {
      margin: 0;
      color: var(--cyan);
      font-size: clamp(1.85rem, 6.5vw, 2.4rem);
      line-height: 1;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0, 255, 231, 0.78);
    }

    .subtitle {
      margin: 10px 0 22px;
      color: var(--pink);
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 9px rgba(255, 0, 85, 0.62);
    }

    form { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }

    label {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 0.78rem 0.88rem;
      border: 1px solid rgba(0, 255, 231, 0.9);
      border-radius: 5px;
      outline: none;
      color: #fff;
      background: #080d17;
      font: inherit;
    }
    input:focus { border-color: var(--pink); background: #0b101c; box-shadow: 0 0 0 2px rgba(255, 0, 85, 0.2); }
    input[aria-invalid="true"] { border-color: var(--warn); }

    .trap { position: absolute; left: -10000px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    button, .assist { min-height: 50px; border-radius: 6px; font: inherit; letter-spacing: 0.14em; text-transform: uppercase; }
    button {
      margin-top: 4px; border: 0;
      color: #061018;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      box-shadow: 0 0 15px rgba(0, 255, 231, 0.58), 0 0 14px rgba(255, 0, 85, 0.44);
      cursor: pointer; font-weight: 800;
    }
    button:hover { color: #fff; filter: saturate(1.14); }
    button:disabled { cursor: wait; filter: grayscale(0.8); opacity: 0.8; }

    .assist {
      display: inline-grid; place-items: center; width: 100%;
      margin-top: 12px;
      border: 1px solid rgba(0, 255, 231, 0.55);
      color: var(--text); background: #080d17;
      font-size: 0.78rem; text-decoration: none;
    }
    .assist:hover { border-color: var(--pink); color: var(--cyan); }

    .status {
      min-height: 1.35em;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }
    .status.ok   { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.bad  { color: var(--pink); }

    .ticket {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid rgba(0, 255, 231, 0.35);
      border-radius: 6px;
      color: var(--muted);
      background: rgba(8, 13, 23, 0.72);
      font-size: 0.78rem;
      line-height: 1.55;
      text-align: center;
      word-break: break-word;
    }
    .ticket strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 0.86rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .ticket code { color: var(--warn); }

    .fineprint { margin-top: 14px; color: rgba(237, 248, 251, 0.5); font-size: 0.7rem; text-align: center; letter-spacing: 0.08em; }
    .fineprint a { color: var(--cyan); text-decoration: underline dotted; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="training-banner" role="note">
      Training surface · <a href="challenge.html">brief</a>
    </div>

    <section class="panel" aria-labelledby="title">
      <img class="brand-mark" src="assets/skull.png" width="76" height="76" alt="">
      <h1 id="title">CyberWorld</h1>
      <div class="subtitle">Recovery</div>

      <form id="recover" novalidate autocomplete="off">
        <div class="field">
          <label for="identifier">Identifier</label>
          <input id="identifier" name="identifier" type="text" minlength="3" maxlength="254" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </div>

        <input class="trap" id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input class="trap" id="phone"   name="phone"   type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button id="submit" type="submit">Continue</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="ticket" class="ticket" hidden></div>
      <a class="assist" href="index.html">Back to login</a>
    </section>
  </main>

  <script>
  /* ====================================================================
     CyberWorld :: Recovery v2.0
     Same math layer as index.html (sha256/hmac/png-binding) — used only
     to mint a deterministic local ticket. The ticket lives in
     sessionStorage under cw.recovery and expires in 10 minutes.
     ==================================================================== */
  (() => {
    "use strict";

    const KEY_DERIVATION = "cyberworld:training:v2:2026-05-26:personfu";
    const enc = new TextEncoder();
    const dec = new TextDecoder("utf-8", { fatal: false });

    const settings = Object.freeze({
      requestKey:      "cw.recovery",
      attemptsKey:     "cw.recovery.attempts",
      maxAttempts:     4,
      lockMs:          120_000,
      minDelayMs:      520,
      maxDelayMs:      1450,
      requestTtlMs:    10 * 60 * 1000,
      assetUrl:        "assets/seal.png",
      maxAssetBytes:   1_048_576,
      maxTailBytes:    8192,
      maxEmbeddedBytes:16_384,
      scanLimitBytes:  4096
    });

    const PNG_SIG  = Uint8Array.from([137, 80, 78, 71, 13, 10, 26, 10]);
    const PNG_IEND = Uint8Array.from([0, 0, 0, 0, 73, 69, 78, 68, 174, 66, 96, 130]);
    const TRAILER_MAGIC = "CYBERWORLD_TRAILER_V1";

    const deniedEmbeddedPatterns = [
      /document\s*\.\s*cookie/, /localstorage/, /sessionstorage/,
      /navigator\s*\.\s*sendbeacon/, /fetch\s*\(/, /xmlhttprequest/,
      /formdata/, /credential/, /password/, /keystroke/, /keydown/,
      /keyup/, /input\s*event/, /eval\s*\(/, /new\s+function/,
      /import\s*\(/, /<script/, /atob\s*\(/, /powershell/, /cmd\.exe/,
      /https?:\/\//, /webhook/, /discord(?:app)?\.com\/api/, /telegram/
    ];

    const toHex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    async function sha256(b) { return new Uint8Array(await crypto.subtle.digest("SHA-256", b)); }
    async function sha256Hex(b) { return toHex(await sha256(b instanceof Uint8Array ? b : enc.encode(b))); }

    function hasPrefix(b, p) {
      if (b.length < p.length) return false;
      for (let i = 0; i < p.length; i += 1) if (b[i] !== p[i]) return false;
      return true;
    }
    function findIendEnd(b) {
      for (let off = b.length - PNG_IEND.length; off >= 0; off -= 1) {
        let ok = true;
        for (let i = 0; i < PNG_IEND.length; i += 1)
          if (b[off + i] !== PNG_IEND[i]) { ok = false; break; }
        if (ok) return off + PNG_IEND.length;
      }
      return -1;
    }
    function readAlpha(img) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const px = ctx.getImageData(0, 0, c.width, c.height).data;
      function rb(i) {
        let v = 0;
        for (let bit = 0; bit < 8; bit += 1)
          v = (v << 1) | (px[(i * 8 + bit) * 4 + 3] & 1);
        return v;
      }
      const L = (rb(0) << 24) | (rb(1) << 16) | (rb(2) << 8) | rb(3);
      if (L < 0 || L > settings.maxEmbeddedBytes) throw new Error("asset:alpha-length");
      const o = new Uint8Array(L);
      for (let i = 0; i < L; i += 1) o[i] = rb(i + 4);
      return o;
    }
    function assertBenign(bytes) {
      const text = dec.decode(bytes.slice(0, Math.min(bytes.length, settings.scanLimitBytes))).toLowerCase();
      for (const p of deniedEmbeddedPatterns) if (p.test(text)) throw new Error("asset:denied");
    }

    async function validateAsset() {
      const img = new Image(); img.decoding = "async";
      img.src = settings.assetUrl; await img.decode();
      const r = await fetch(settings.assetUrl, { cache: "no-store", credentials: "same-origin" });
      if (!r.ok) throw new Error("asset:fetch");
      const bytes = new Uint8Array(await r.arrayBuffer());
      if (bytes.length > settings.maxAssetBytes || !hasPrefix(bytes, PNG_SIG))
        throw new Error("asset:signature");
      const ie = findIendEnd(bytes);
      if (ie < 0) throw new Error("asset:iend");
      const tail = bytes.slice(ie);
      if (tail.length === 0 || tail.length > settings.maxTailBytes)
        throw new Error("asset:tail-size");
      const alpha = readAlpha(img);
      assertBenign(tail); assertBenign(alpha);
      if (!dec.decode(tail).includes(TRAILER_MAGIC)) throw new Error("asset:trailer-magic");
      return { file: await sha256Hex(bytes), tail: await sha256Hex(tail), alpha: await sha256Hex(alpha) };
    }

    const form       = document.getElementById("recover");
    const identifier = document.getElementById("identifier");
    const submit     = document.getElementById("submit");
    const status     = document.getElementById("status");
    const ticketBox  = document.getElementById("ticket");
    const traps      = [document.getElementById("website"), document.getElementById("phone")];
    const runtime    = { asset: null, busy: false };

    if (window.top !== window.self) {
      document.documentElement.style.display = "none";
      try { window.top.location = window.location.href; } catch { return; }
    }

    function setStatus(t, k) { status.textContent = t; status.className = k ? "status " + k : "status"; }
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const randomDelay = () => settings.minDelayMs +
      Math.floor(Math.random() * (settings.maxDelayMs - settings.minDelayMs));

    function classify(value) {
      const v = value.trim();
      if (v.length < 3 || v.length > 254) return null;
      if (/^[^\s@]{1,64}@[^\s@]{1,188}\.[^\s@]{2,24}$/.test(v)) return "email";
      if (/^[a-zA-Z0-9._@-]{3,64}$/.test(v))                    return "handle";
      return null;
    }
    function mask(v, t) {
      const x = v.trim();
      if (t === "email") {
        const [local, ...rest] = x.split("@");
        return (local || "").slice(0, 1) + "***@" + rest.join("@").toLowerCase();
      }
      return x.length <= 4 ? x.slice(0, 1) + "***" : x.slice(0, 2) + "***" + x.slice(-2);
    }
    function readAttempt() {
      const now = Date.now();
      try {
        const v = JSON.parse(sessionStorage.getItem(settings.attemptsKey) || "null");
        if (v && v.until > now) return v;
      } catch { return { count: 0, until: now + settings.lockMs }; }
      return { count: 0, until: now + settings.lockMs };
    }
    function recordAttempt() {
      const s = readAttempt(); s.count += 1;
      sessionStorage.setItem(settings.attemptsKey, JSON.stringify(s));
      return s.count <= settings.maxAttempts;
    }

    async function mintTicket(value, type, asset) {
      const issued = Date.now();
      const normalized = type === "email" ? value.trim().toLowerCase() : value.trim();
      const seedMaterial = [
        await sha256Hex(enc.encode(normalized)),
        asset.file.slice(0, 24),
        asset.tail.slice(0, 24),
        String(issued)
      ].join("|");
      const seedHash = await sha256Hex(enc.encode(seedMaterial));
      return {
        v: 1,
        type,
        masked:  mask(normalized, type),
        ref:     seedHash.slice(0, 24),
        asset:   asset.file.slice(0, 24),
        ticket:  "CW-" + seedHash.slice(0, 12).toUpperCase(),
        i: issued,
        e: issued + settings.requestTtlMs
      };
    }

    function paintTicket(t) {
      ticketBox.hidden = false;
      ticketBox.innerHTML =
        `<strong>${t.ticket}</strong>` +
        `<code>${t.masked}</code>`;
    }

    async function handleSubmit(event) {
      event.preventDefault();
      if (runtime.busy) return;

      const value   = identifier.value.trim();
      const type    = classify(value);
      const trapped = traps.some((i) => i.value.trim().length > 0);
      identifier.setAttribute("aria-invalid", String(!type));
      ticketBox.hidden = true;
      ticketBox.textContent = "";

      if (trapped) {
        await wait(randomDelay());
        setStatus("Unable to continue (honeypot tripped).", "bad");
        return;
      }
      if (!recordAttempt()) {
        await wait(randomDelay());
        setStatus("Try again later (local rate-limit).", "warn");
        return;
      }
      if (!type) {
        await wait(randomDelay());
        setStatus("Enter a valid training email or handle.", "warn");
        return;
      }

      runtime.busy = true; submit.disabled = true;
      setStatus("Validating asset & minting local ticket…");

      try {
        if (!runtime.asset) runtime.asset = await validateAsset();
        const ticket = await mintTicket(value, type, runtime.asset);
        sessionStorage.setItem(settings.requestKey, JSON.stringify(ticket));
        await wait(randomDelay());
        setStatus("Local ticket minted.", "ok");
        paintTicket(ticket);
        form.reset();
      } catch (err) {
        await wait(randomDelay());
        setStatus("Unable to continue (" + ((err && err.message) || "unknown") + ").", "bad");
      } finally {
        runtime.busy = false;
        submit.disabled = false;
      }
    }

    form.addEventListener("submit", handleSubmit);
    validateAsset().catch(() => { runtime.asset = null; });
  })();
  </script>
</body>
</html>
