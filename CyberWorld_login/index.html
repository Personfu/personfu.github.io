<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="robots" content="noindex,nofollow">
  <title>CyberWorld</title>
  <style>
    :root {
      --cyan: #00ffe7;
      --pink: #ff0055;
      --ink: #060a12;
      --panel: rgba(9, 13, 25, 0.94);
      --panel-2: rgba(16, 24, 39, 0.72);
      --text: #edf8fb;
      --muted: #8ba8b7;
      --warn: #ffbf00;
      --ok: #20d978;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 29%, rgba(0, 255, 231, 0.18), rgba(0, 255, 231, 0.035) 28%, transparent 56%),
        linear-gradient(135deg, #0a171d 0%, #101528 51%, #244f60 100%);
      font-family: "Courier New", Consolas, ui-monospace, monospace;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0, 255, 231, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 231, 0.055) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.2), transparent);
      background-size: 100% 4px;
      opacity: 0.32;
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(424px, calc(100vw - 32px));
    }

    .panel {
      padding: 34px 32px 30px;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(13, 18, 34, 0.98), rgba(8, 11, 22, 0.96)),
        var(--panel);
      box-shadow:
        0 0 34px rgba(0, 255, 231, 0.23),
        0 0 90px rgba(0, 255, 231, 0.1),
        inset 0 0 24px rgba(0, 255, 231, 0.04);
    }

    .brand-mark {
      display: block;
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.9));
    }

    h1 {
      margin: 0;
      color: var(--cyan);
      font-size: clamp(2rem, 7vw, 2.5rem);
      line-height: 1;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0, 255, 231, 0.78);
    }

    .subtitle {
      margin: 12px 0 28px;
      color: var(--pink);
      font-size: 0.86rem;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 9px rgba(255, 0, 85, 0.62);
    }

    form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 0.78rem 0.88rem;
      border: 1px solid rgba(0, 255, 231, 0.9);
      border-radius: 5px;
      outline: none;
      color: #fff;
      background: #080d17;
      font: inherit;
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    input:focus {
      border-color: var(--pink);
      background: #0b101c;
      box-shadow:
        0 0 0 2px rgba(255, 0, 85, 0.2),
        0 0 15px rgba(0, 255, 231, 0.13);
    }

    input[aria-invalid="true"] {
      border-color: var(--warn);
    }

    .trap {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    button {
      min-height: 50px;
      margin-top: 4px;
      border: 0;
      border-radius: 6px;
      color: #061018;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      box-shadow:
        0 0 15px rgba(0, 255, 231, 0.58),
        0 0 14px rgba(255, 0, 85, 0.44);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 140ms ease, filter 140ms ease, transform 140ms ease;
    }

    button:hover {
      color: #fff;
      filter: saturate(1.14);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      filter: grayscale(0.8);
      opacity: 0.8;
    }

    .status {
      min-height: 1.35em;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.warn {
      color: var(--warn);
    }

    .status.bad {
      color: var(--pink);
    }

    .fineprint {
      margin-top: 16px;
      color: rgba(237, 248, 251, 0.42);
      font-size: 0.68rem;
      text-align: center;
      letter-spacing: 0.08em;
    }

    @media (max-width: 430px) {
      .panel {
        padding: 28px 22px 24px;
      }

      .brand-mark {
        width: 68px;
        height: 68px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="title">
      <img class="brand-mark" src="assets/skull.png" width="76" height="76" alt="">
      <h1 id="title">CyberWorld</h1>
      <div class="subtitle">Enter if you dare</div>

      <form id="gate" novalidate autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
        </div>

        <input class="trap" id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input class="trap" id="middleName" name="middle_name" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button id="submit" type="submit">Log In</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
    <div class="fineprint">CyberWorld</div>
  </main>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("gate");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const submit = document.getElementById("submit");
      const status = document.getElementById("status");
      const traps = [
        document.getElementById("website"),
        document.getElementById("middleName")
      ];

      const settings = Object.freeze({
        attemptsKey: "cw.a",
        maxAttempts: 5,
        lockMs: 90000,
        minDelayMs: 420,
        maxDelayMs: 1250,
        assetUrl: "assets/seal.png",
        maxAssetBytes: 1048576,
        maxTailBytes: 8192,
        maxEmbeddedBytes: 16384,
        maxNonce: 160000,
        powBits: 16
      });

      const pngSignature = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
      const pngIend = new Uint8Array([0, 0, 0, 0, 73, 69, 78, 68, 174, 66, 96, 130]);
      const textEncoder = new TextEncoder();
      const runtime = {
        asset: null,
        busy: false
      };

      function setStatus(text, kind) {
        status.textContent = text;
        status.className = kind ? "status " + kind : "status";
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      function randomDelay() {
        const span = settings.maxDelayMs - settings.minDelayMs;
        return settings.minDelayMs + Math.floor(Math.random() * span);
      }

      async function hashHex(algorithm, data) {
        const digest = await crypto.subtle.digest(algorithm, data);
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function hasPrefix(bytes, prefix) {
        if (bytes.length < prefix.length) return false;
        for (let index = 0; index < prefix.length; index += 1) {
          if (bytes[index] !== prefix[index]) return false;
        }
        return true;
      }

      function findIendEnd(bytes) {
        for (let offset = bytes.length - pngIend.length; offset >= 0; offset -= 1) {
          let matched = true;
          for (let index = 0; index < pngIend.length; index += 1) {
            if (bytes[offset + index] !== pngIend[index]) {
              matched = false;
              break;
            }
          }
          if (matched) return offset + pngIend.length;
        }
        return -1;
      }

      function readAlphaBytes(image) {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(image, 0, 0);
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;

        function readByte(byteIndex) {
          let value = 0;
          for (let bit = 0; bit < 8; bit += 1) {
            const pixelIndex = byteIndex * 8 + bit;
            value = (value << 1) | (pixels[pixelIndex * 4 + 3] & 1);
          }
          return value;
        }

        const length = (readByte(0) << 24) | (readByte(1) << 16) | (readByte(2) << 8) | readByte(3);
        if (length < 0 || length > settings.maxEmbeddedBytes) throw new Error("asset");

        const output = new Uint8Array(length);
        for (let index = 0; index < length; index += 1) {
          output[index] = readByte(index + 4);
        }
        return output;
      }

      async function validateAsset() {
        const image = new Image();
        image.decoding = "async";
        image.src = settings.assetUrl;
        await image.decode();

        const response = await fetch(settings.assetUrl, { cache: "no-store", credentials: "same-origin" });
        if (!response.ok) throw new Error("asset");

        const bytes = new Uint8Array(await response.arrayBuffer());
        if (bytes.length > settings.maxAssetBytes || !hasPrefix(bytes, pngSignature)) throw new Error("asset");

        const iendEnd = findIendEnd(bytes);
        if (iendEnd < 0) throw new Error("asset");

        const tail = bytes.slice(iendEnd);
        if (tail.length === 0 || tail.length > settings.maxTailBytes) throw new Error("asset");

        const embedded = readAlphaBytes(image);
        runtime.asset = {
          file: await hashHex("SHA-256", bytes),
          tail: await hashHex("SHA-256", tail),
          embedded: await hashHex("SHA-256", embedded)
        };
      }

      function readAttemptState() {
        const now = Date.now();
        try {
          const parsed = JSON.parse(sessionStorage.getItem(settings.attemptsKey) || "null");
          if (parsed && parsed.until > now) return parsed;
        } catch {
          return { count: 0, until: now + settings.lockMs };
        }
        return { count: 0, until: now + settings.lockMs };
      }

      function recordAttempt() {
        const item = readAttemptState();
        item.count += 1;
        sessionStorage.setItem(settings.attemptsKey, JSON.stringify(item));
        return item.count <= settings.maxAttempts;
      }

      function validUsername(value) {
        return /^[a-zA-Z0-9._@-]{3,64}$/.test(value);
      }

      function validPassword(value) {
        if (value.length < 8 || value.length > 128) return false;
        if (/^\s|\s$/.test(value)) return false;
        if (/^(.)\1+$/.test(value)) return false;
        return true;
      }

      async function proofOfWork(seed) {
        for (let nonce = 0; nonce <= settings.maxNonce; nonce += 1) {
          const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", textEncoder.encode(seed + ":" + nonce)));
          let zeroBits = 0;
          for (const byte of digest) {
            if (byte === 0) {
              zeroBits += 8;
              continue;
            }
            for (let bit = 7; bit >= 0; bit -= 1) {
              if ((byte >> bit) & 1) break;
              zeroBits += 1;
            }
            break;
          }
          if (zeroBits >= settings.powBits) return nonce;
          if (nonce > 0 && nonce % 5000 === 0) await wait(0);
        }
        throw new Error("busy");
      }

      async function handleSubmit(event) {
        event.preventDefault();
        if (runtime.busy) return;

        const userValue = username.value.trim();
        const passValue = password.value;
        const trapped = traps.some((input) => input.value.trim().length > 0);

        username.setAttribute("aria-invalid", String(!validUsername(userValue)));
        password.setAttribute("aria-invalid", String(!validPassword(passValue)));

        if (trapped) {
          await wait(randomDelay());
          setStatus("Unable to sign in.", "bad");
          return;
        }

        if (!recordAttempt()) {
          await wait(randomDelay());
          setStatus("Try again later.", "warn");
          return;
        }

        if (!validUsername(userValue) || !validPassword(passValue)) {
          await wait(randomDelay());
          setStatus("Check username and password.", "warn");
          return;
        }

        runtime.busy = true;
        submit.disabled = true;
        setStatus("Checking access...", "");

        try {
          if (!runtime.asset) await validateAsset();
          const userHash = await hashHex("SHA-256", textEncoder.encode(userValue));
          const passHash = await hashHex("SHA-256", textEncoder.encode(passValue));
          const nonce = await proofOfWork(userHash.slice(0, 24) + ":" + runtime.asset.file.slice(0, 24));

          sessionStorage.setItem("cw.r", JSON.stringify({
            u: userHash.slice(0, 24),
            p: passHash.slice(0, 12),
            a: runtime.asset.file.slice(0, 24),
            n: nonce,
            t: Date.now()
          }));

          await wait(randomDelay());
          setStatus("Request received.", "ok");
          form.reset();
        } catch {
          await wait(randomDelay());
          setStatus("Unable to sign in.", "bad");
        } finally {
          runtime.busy = false;
          submit.disabled = false;
        }
      }

      form.addEventListener("submit", handleSubmit);
      validateAsset().catch(() => {
        runtime.asset = null;
      });
    })();
  </script>
</body>
</html>
