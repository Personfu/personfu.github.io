<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARS // HALL OF FAME</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#00e8ff;font-family:'Share Tech Mono',monospace;min-height:100vh}
a{color:#00e8ff;text-decoration:none}a:hover{color:#ff2bd6}
#top-bar{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00e8ff33}
#top-bar h1{font-family:'VT323',monospace;font-size:32px;letter-spacing:3px}
.container{max-width:900px;margin:30px auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.achievement{padding:20px;border:1px solid #333;border-radius:6px;background:rgba(0,0,0,0.3);position:relative;transition:all .3s}
.achievement.locked{opacity:0.4;filter:grayscale(1)}
.achievement.unlocked{border-color:#00ff9c88;box-shadow:0 0 20px #00ff9c22}
.achievement .icon{font-size:36px;margin-bottom:8px}
.achievement h3{font-family:'VT323',monospace;font-size:22px;color:#00e8ff;margin-bottom:4px}
.achievement.unlocked h3{color:#00ff9c}
.achievement p{font-size:12px;color:#888;line-height:1.5}
.achievement .status{position:absolute;top:12px;right:12px;font-size:10px;padding:3px 8px;border-radius:2px}
.achievement.unlocked .status{background:#00ff9c22;color:#00ff9c;border:1px solid #00ff9c44}
.achievement.locked .status{background:#33333344;color:#666;border:1px solid #333}
.summary{text-align:center;margin:20px 0 30px;font-family:'VT323',monospace;font-size:24px;color:#ffb347}
</style>
</head>
<body>
<div id="top-bar">
<h1>STARS // HALL OF FAME</h1>
<a href="/CyberWorld/">&#8592; Back to CyberWorld</a>
</div>
<div class="container">
<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>
</div>
<script>
function loadData(){
let d=null;
try{d=JSON.parse(localStorage.getItem('cw.operative.v2'))}catch(e){}
if(!d)try{d=JSON.parse(localStorage.getItem('cw.operative.v1'))}catch(e){}
return d||{};
}

const d=loadData();
const level=d.level||0;
const missions=d.missions||d.missionsCompleted||0;
const daemonsKilled=d.daemonsKilled||d.daemonSlain||0;
const codexCount=d.codexCount||d.codexEntries||(d.codex?d.codex.length:0)||0;
const wargames=d.wargamesCompleted||d.wargamesDone||0;
const wargamesTotal=d.wargamesTotal||10;
const ctfs=d.ctfsCompleted||d.ctfsDone||0;
const ctfsTotal=d.ctfsTotal||8;
const missionsTotal=d.missionsTotal||d.totalMissions||20;
const factions=d.factions||d.factionStanding||{};
const skills=d.skills||{};
const sentinelBeaten=d.sentinelBeaten||d.sentinelDefeated||false;
const allFactionsPositive=Object.keys(factions).length>=3&&Object.values(factions).every(v=>v>0);
const allSkillsAbove50=Object.keys(skills).length>=5&&Object.values(skills).every(v=>v>50);

const achievements=[
{icon:"&#9876;",title:"FIRST BLOOD",desc:"Complete your first mission.",check:missions>=1},
{icon:"&#9000;",title:"SCRIPT KIDDIE",desc:"Reach Tier 2 (Level 2+).",check:level>=2},
{icon:"&#9731;",title:"HACKER",desc:"Reach Tier 5 (Level 5+).",check:level>=5},
{icon:"&#9733;",title:"ELITE",desc:"Reach Tier 8 (Level 8+).",check:level>=8},
{icon:"&#9760;",title:"DAEMON SLAYER",desc:"Eliminate 10 daemons.",check:daemonsKilled>=10},
{icon:"&#9782;",title:"CODEX SCHOLAR",desc:"Unlock 20 codex entries.",check:codexCount>=20},
{icon:"&#9879;",title:"WAR HERO",desc:"Complete all wargame challenges.",check:wargames>=wargamesTotal&&wargames>0},
{icon:"&#9873;",title:"CTF CHAMPION",desc:"Complete all CTF trails.",check:ctfs>=ctfsTotal&&ctfs>0},
{icon:"&#10004;",title:"FULL CLEARANCE",desc:"Complete all missions.",check:missions>=missionsTotal&&missions>0},
{icon:"&#9878;",title:"FACTION DIPLOMAT",desc:"Achieve positive standing with all factions.",check:allFactionsPositive},
{icon:"&#9881;",title:"MASTER ANALYST",desc:"Raise all 5 skills above 50.",check:allSkillsAbove50},
{icon:"&#9889;",title:"STORMCORE SURVIVOR",desc:"Defeat the Sentinel daemon.",check:!!sentinelBeaten}
];

const grid=document.getElementById('grid');
let unlocked=0;
achievements.forEach(a=>{
if(a.check)unlocked++;
const div=document.createElement('div');
div.className='achievement '+(a.check?'unlocked':'locked');
div.innerHTML=`<div class="icon">${a.icon}</div><h3>${a.title}</h3><p>${a.desc}</p><div class="status">${a.check?'UNLOCKED':'LOCKED'}</div>`;
grid.appendChild(div);
});

document.getElementById('summary').textContent=`ACHIEVEMENTS UNLOCKED: ${unlocked} / ${achievements.length}`;
</script>
</body>
</html>
