<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberWorld Route Check</title>
<style>
body{margin:0;background:#02070d;color:#dffbff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;padding:24px}
h1{color:#00e8ff;font-size:24px;margin:0 0 8px}
p{color:#a8c8d8;max-width:760px;line-height:1.5}
button{background:#06101a;color:#00e8ff;border:1px solid #00e8ff66;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:#00ff9c;color:#00ff9c}
.grid{display:grid;gap:8px;margin-top:18px;max-width:980px}
.row{display:grid;grid-template-columns:170px 1fr 120px;gap:8px;align-items:center;border:1px solid #00e8ff22;background:#06101a;padding:8px}
.path{color:#ffb347;overflow-wrap:anywhere}.ok{color:#00ff9c}.bad{color:#ff5c8a}.wait{color:#a8c8d8}
a{color:#00e8ff}
</style>
</head>
<body>
<h1>CyberWorld Route Check</h1>
<p>Static GitHub Pages module probe. It validates that the desktop, training login, game, hangar, math visualization, and supporting modules resolve with successful HTTP responses.</p>
<button id="run">Run route check</button>
<div id="out" class="grid"></div>
<script>
async function loadRoutes(){
  const res = await fetch('/cyberworld-routes.json?ts=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('route manifest HTTP ' + res.status);
  return (await res.json()).routes || [];
}
function row(route,status,cls){
  return '<div class="row"><strong>'+route.label+'</strong><a class="path" href="'+route.path+'">'+route.path+'</a><span class="'+cls+'">'+status+'</span></div>';
}
async function check(){
  const out=document.getElementById('out');
  out.innerHTML='<div class="wait">Loading route manifest...</div>';
  const routes=await loadRoutes();
  out.innerHTML=routes.map(r=>row(r,'queued','wait')).join('');
  const results=[];
  for(const r of routes){
    let status='FAIL', cls='bad';
    try{
      const res=await fetch(r.path + (r.path.includes('?')?'&':'?') + 'route_check=' + Date.now(), {cache:'no-store'});
      status=res.ok ? 'OK '+res.status : 'HTTP '+res.status;
      cls=res.ok ? 'ok' : 'bad';
    }catch(e){ status='ERROR'; cls='bad'; }
    results.push(row(r,status,cls));
    out.innerHTML=results.concat(routes.slice(results.length).map(q=>row(q,'queued','wait'))).join('');
  }
}
document.getElementById('run').addEventListener('click',check);
check().catch(e=>{document.getElementById('out').innerHTML='<div class="bad">'+e.message+'</div>';});
</script>
</body>
</html>
