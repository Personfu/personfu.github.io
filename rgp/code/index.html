<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERWORLD // RS_SOC // FURIOS-INT</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { background: #000; margin: 0; padding: 0; overflow: hidden; font-family: 'VT323', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { border: 4px solid #00e8ff; box-shadow: 0 0 20px #00e8ff; width: 1024px; height: 768px; position: relative; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="src/game.js" type="module"></script>
<div id="missing-notice" style="position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;color:#00e8ff;font-size:18px;font-family:monospace;flex-direction:column;gap:12px;z-index:9999">
<div>⚠ rgp/src/game.js not found — this is a stub page</div>
<a href="../../rpg/index.html" style="color:#00e8ff;font-size:14px">→ Launch CyberWorld RPG</a>
</div>
<script>if(!document.getElementById('missing-notice')){}
// Check if game.js loaded
window.addEventListener('error',function(e){if(e.filename&&e.filename.includes('game.js')){document.getElementById('missing-notice').style.display='flex';}},{once:true});
setTimeout(()=>{const n=document.getElementById('missing-notice');if(n)n.style.display='flex';},1500);
</script>
</body>
</html>
