<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Visualization // CyberWorld</title><link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/cyberworld-unified.css?v=20260617-unified"><style>body{margin:0;min-height:100vh;background:#02070d;color:#dffbff;font-family:'Share Tech Mono',monospace}.wrap{max-width:1100px;margin:0 auto;padding:18px}.hero,.panel{border:1px solid #00e8ff33;background:#06101a;padding:14px;margin:12px 0}h1{font-family:'VT323';font-size:40px;color:#00e8ff;margin:0}.grid{display:grid;grid-template-columns:340px 1fr;gap:12px}.ctrl label{display:block;color:#ffdf78;margin:10px 0 4px;font-size:12px}.ctrl input,.ctrl select{width:100%;background:#02070d;color:#dffbff;border:1px solid #00e8ff55;padding:8px;font-family:inherit}canvas{width:100%;height:440px;background:#02070d;border:1px solid #00e8ff33}.readout{font-size:12px;line-height:1.6;color:#a8c8d8}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style></head><body><script src="/js/cyberworld-unified.js?v=20260617-unified" defer></script><main class="wrap"><section class="hero"><h1>Math Visualization Lab</h1><p>Interactive plotting deck for sine, cosine, parabola, and damped telemetry curves. This replaces the broken redirect and gives `/mathviz/` something real to load.</p></section><section class="grid"><div class="panel ctrl"><label>Function</label><select id="fn"><option value="sin">sin(kx + phase)</option><option value="cos">cos(kx + phase)</option><option value="parabola">a·x² + phase</option><option value="damped">e^-0.08x · sin(kx + phase)</option></select><label>Amplitude / a</label><input id="amp" type="range" min="0.2" max="3" step="0.1" value="1"><label>Frequency k</label><input id="freq" type="range" min="0.2" max="5" step="0.1" value="1"><label>Phase</label><input id="phase" type="range" min="-6.28" max="6.28" step="0.01" value="0"><div class="readout" id="out"></div></div><div class="panel"><canvas id="plot" width="900" height="440"></canvas></div></section></main><script>const c=document.getElementById('plot'),ctx=c.getContext('2d'),fn=document.getElementById('fn'),amp=document.getElementById('amp'),freq=document.getElementById('freq'),phase=document.getElementById('phase'),out=document.getElementById('out');function y(x){const A=+amp.value,k=+freq.value,p=+phase.value;if(fn.value==='cos')return A*Math.cos(k*x+p);if(fn.value==='parabola')return A*.08*x*x+p*.12;if(fn.value==='damped')return A*Math.exp(-.08*(x+10))*Math.sin(k*x+p);return A*Math.sin(k*x+p)}function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(0,232,255,.18)';ctx.lineWidth=1;for(let x=0;x<c.width;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}for(let yy=0;yy<c.height;yy+=44){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(c.width,yy);ctx.stroke()}ctx.strokeStyle='#ffdf78';ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();ctx.strokeStyle='#00e8ff';ctx.lineWidth=3;ctx.beginPath();for(let px=0;px<c.width;px++){const x=(px/c.width)*20-10;const py=c.height/2-y(x)*70;if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();out.innerHTML='Function: '+fn.value+'<br>Amplitude: '+amp.value+'<br>Frequency: '+freq.value+'<br>Phase: '+Number(phase.value).toFixed(2)}[fn,amp,freq,phase].forEach(el=>el.addEventListener('input',draw));draw();</script></body></html>
