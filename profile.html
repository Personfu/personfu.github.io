<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERATIVE DOSSIER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02070d;color:#00e8ff;font-family:'Share Tech Mono',monospace;min-height:100vh}
a{color:#00e8ff;text-decoration:none}a:hover{color:#ff2bd6}
#top-bar{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00e8ff33}
#top-bar h1{font-family:'VT323',monospace;font-size:32px;letter-spacing:3px}
.container{max-width:800px;margin:30px auto;padding:0 20px 60px}
.empty{text-align:center;margin-top:100px;color:#ffb347}
.empty h2{font-family:'VT323',monospace;font-size:36px;margin-bottom:20px}
.empty a{display:inline-block;margin-top:20px;padding:10px 24px;border:1px solid #00e8ff;border-radius:3px}
.section{margin:24px 0;padding:16px;background:rgba(0,232,255,0.03);border:1px solid #00e8ff22;border-radius:4px}
.section h3{font-family:'VT323',monospace;font-size:22px;color:#ff2bd6;margin-bottom:12px}
.callsign{font-family:'VT323',monospace;font-size:48px;text-align:center;color:#00e8ff;margin:20px 0;text-shadow:0 0 20px #00e8ff44}
.stat-row{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0}
.stat{flex:1;min-width:120px;text-align:center;padding:12px;background:rgba(0,0,0,0.3);border:1px solid #00e8ff11;border-radius:3px}
.stat .label{font-size:10px;color:#ffb347;margin-bottom:4px}
.stat .val{font-family:'VT323',monospace;font-size:28px;color:#00ff9c}
.bar-wrap{margin:8px 0}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar-label span:last-child{color:#00ff9c}
.bar{height:16px;background:#0a1020;border:1px solid #00e8ff22;border-radius:2px;overflow:hidden}
.bar-fill{height:100%;transition:width .5s;border-radius:2px}
.faction-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #00e8ff11;font-size:13px}
.inv-grid{display:flex;flex-wrap:wrap;gap:8px}
.inv-item{padding:6px 12px;background:#0a1020;border:1px solid #00e8ff22;border-radius:3px;font-size:12px;color:#00ff9c}
.btns{display:flex;gap:12px;justify-content:center;margin:30px 0}
.btn{background:transparent;border:1px solid #00e8ff44;color:#00e8ff;padding:10px 20px;font-family:'Share Tech Mono',monospace;cursor:pointer;border-radius:3px;font-size:13px}
.btn:hover{background:#00e8ff22;border-color:#00e8ff}
</style>
</head>
<body>
<div id="top-bar">
<h1>OPERATIVE DOSSIER</h1>
<a href="/CyberWorld/">&#8592; Back to CyberWorld</a>
</div>
<div class="container" id="content"></div>
<input type="file" id="imp" style="display:none" accept=".json">
<script>
const content=document.getElementById('content');

function loadData(){
let d=null;
try{d=JSON.parse(localStorage.getItem('cw.operative.v2'))}catch(e){}
if(!d)try{d=JSON.parse(localStorage.getItem('cw.operative.v1'))}catch(e){}
return d;
}

function barHTML(label,val,max,color){
const pct=Math.min(100,Math.round((val/max)*100));
return `<div class="bar-wrap"><div class="bar-label"><span>${label}</span><span>${val} / ${max}</span></div><div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
}

function render(){
const d=loadData();
if(!d){
content.innerHTML=`<div class="empty"><h2>NO OPERATIVE DATA FOUND</h2><p>Launch CyberWorld to create your operative profile.</p><a href="/CyberWorld/">Launch CyberWorld</a><div class="btns" style="margin-top:30px"><button class="btn" onclick="document.getElementById('imp').click()">Import Save</button></div></div>`;
return;
}

const callsign=d.callsign||d.name||'UNKNOWN';
const level=d.level||1;
const xp=d.xp||0;
const xpMax=d.xpMax||(level*100);
const hp=d.hp||d.health||100;
const hpMax=d.hpMax||d.maxHealth||100;
const shield=d.shield||d.shields||0;
const shieldMax=d.shieldMax||d.maxShields||100;
const credits=d.credits||d.gold||0;
const skills=d.skills||{recon:10,exploit:10,forensics:10,crypto:10,defense:10};
const factions=d.factions||d.factionStanding||{GRIDWATCH:0,'PHANTOM SYNDICATE':0,'NEXUS CORP':0};
const missions=d.missions||d.missionsCompleted||0;
const inventory=d.inventory||d.items||[];
const codexCount=d.codexCount||d.codexEntries||(d.codex?d.codex.length:0)||0;

let html=`<div class="callsign">${callsign}</div>`;

html+=`<div class="stat-row">
<div class="stat"><div class="label">LEVEL</div><div class="val">${level}</div></div>
<div class="stat"><div class="label">CREDITS</div><div class="val">${credits}</div></div>
<div class="stat"><div class="label">MISSIONS</div><div class="val">${missions}</div></div>
<div class="stat"><div class="label">CODEX</div><div class="val">${codexCount}</div></div>
</div>`;

html+=`<div class="section"><h3>VITALS</h3>`;
html+=barHTML('XP',xp,xpMax,'#00e8ff');
html+=barHTML('HP',hp,hpMax,'#00ff9c');
html+=barHTML('SHIELD',shield,shieldMax,'#ff2bd6');
html+=`</div>`;

html+=`<div class="section"><h3>SKILLS</h3>`;
const skillNames={recon:'RECON',exploit:'EXPLOIT',forensics:'FORENSICS',crypto:'CRYPTO',defense:'DEFENSE'};
Object.entries(skills).forEach(([k,v])=>{
html+=barHTML(skillNames[k]||k.toUpperCase(),v,100,'#ffb347');
});
html+=`</div>`;

html+=`<div class="section"><h3>FACTION STANDING</h3>`;
Object.entries(factions).forEach(([k,v])=>{
const col=v>0?'#00ff9c':v<0?'#ff2bd6':'#ffb347';
html+=`<div class="faction-row"><span>${k}</span><span style="color:${col}">${v>0?'+':''}${v}</span></div>`;
});
html+=`</div>`;

if(inventory.length){
html+=`<div class="section"><h3>INVENTORY</h3><div class="inv-grid">`;
inventory.forEach(item=>{
const name=typeof item==='string'?item:(item.name||item.id||'Unknown');
html+=`<div class="inv-item">${name}</div>`;
});
html+=`</div></div>`;
}

html+=`<div class="btns">
<button class="btn" onclick="exportSave()">Export Save</button>
<button class="btn" onclick="document.getElementById('imp').click()">Import Save</button>
</div>`;

content.innerHTML=html;
}

function exportSave(){
const d=loadData();
if(!d){alert('No data to export');return}
const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='cyberworld-save.json';a.click();
}

document.getElementById('imp').addEventListener('change',e=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>{
try{
const d=JSON.parse(ev.target.result);
localStorage.setItem('cw.operative.v2',JSON.stringify(d));
render();
}catch(err){alert('Invalid save file')}
};
r.readAsText(f);
});

render();
</script>
</body>
</html>
